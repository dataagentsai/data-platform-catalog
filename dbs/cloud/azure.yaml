# DBS cloud layer: Azure (decision M1, ADR-014; the second cloud, ADR-036). Product names are allowed here and nowhere else.
#
# STATUS: written 19 Nov 2026, before any run on an Azure account. What is built and tested is stated per binding in
# `adapter`, and `proves` lists only the obligations a test in the platform repository names. The adapters that exist
# (storage landing, file drop, object store, secret store) pass the shared contract tables against a FAKE of the SDK
# surface: not against the storage emulator and not against a real subscription. The decision record stays `proposed`
# until the 3-day compressed run has passed on a real account (ADR-036, Confirmation).
#
# The cloud layer binds the ports a cloud provides (binds_in includes cloud in dpc/ports.yaml): storage, movers,
# streams, identity, keys, network, infrastructure and the cloud's own logs. It never names an engine feature; the
# engine layer (dbs/engine/databricks.yaml) does, and a stack in dbs/stacks/ composes the two.
#
# Facts checked on 19 Nov 2026 (each is a decision input, re-check before relying on it):
#  - the engine's managed PostgreSQL (Lakebase) is generally available on Azure Databricks since 2 Mar 2026, in a first
#    set of regions that grew by four more on 19 Aug 2026: a stack checks its region;
#  - the event hub service keeps events up to 7 days on the Standard tier and up to 90 days on Premium and Dedicated;
#  - its Capture feature writes Avro to storage; Parquet only through a separate Stream Analytics job. The lander reads
#    JSON lines and Parquet today, so this platform reads partitions through the SDK and does not depend on Capture;
#  - Data Factory's change data capture resource is in public preview and covers SQL Server, Azure SQL Database, Azure
#    SQL Managed Instance and Azure Cosmos DB (the list is version-dependent);
#  - blob soft delete and versioning on a storage account with a hierarchical namespace (Data Lake Storage Gen2) are not
#    confirmed for versioning; container soft delete is supported.
apiVersion: data-binding-layer/v0.1
layer: cloud
name: azure
offering: Microsoft Azure, one subscription per environment (or one resource group per environment to start) under a management group
catalog:
  dac: 0.2.0
  dpc: 0.2.0
decisions:
  landing_layout: {value: "abfss://landing@<prefix><env>.dfs.core.windows.net/<source>/<dataset>/<date>/<name> with <name>.manifest.json written last (the same layout as the first cloud and as a local folder); a separate storage account for personal data", source: chosen}
  storage_naming: {value: "one storage account per environment, named <prefix><env> (lowercase letters and digits, 3 to 24 characters), and one container per layer named exactly by the layer; the account name rule is checked by the adapter (account_name)", source: chosen}
  secret_references: {value: "secret://a/b is held in Key Vault as a--b (slash becomes two hyphens); a name with two hyphens, a hyphen next to a slash (a-/b and a/-b would both become a---b), or a character other than letters, digits, hyphen and slash is refused by the port itself, and one longer than 127 characters once written this way is refused by the adapter. Key Vault names allow letters, digits and hyphens only, which is why the port's grammar is the portable subset (ADR-036)", source: chosen}
  pick_order: {value: "changing databases: Data Factory change data capture where its sources fit (preview), otherwise the source's log read into the event hub's Kafka-compatible endpoint by an open-source log reader (NOT YET VALIDATED); files: storage SFTP and Data Factory copy; APIs: Data Factory REST copy or a function; machines and sensors: event hub; every mover meets the landing contract (ADR-033)", source: chosen}
  federated_catalog: {value: "not bound: no second engine reads this platform's tables on this cloud yet. The first cloud's federation decision does not carry over; bind one here when a reader exists", source: chosen}
  file_formats: {value: "landing as delivered (ADR-031); the lander reads JSON lines and Parquet; event capture's Avro files are NOT read, so streams are read from the hub's partitions and never from Capture output; tables Iceberg on Parquet", source: chosen}
  metadata_store_region: {value: "the engine's managed PostgreSQL must exist in the chosen region (check the region list before choosing one); otherwise the store falls back to a PostgreSQL flexible server behind the same stored procedures (ADR-010) - NOT BUILT", source: chosen}
thresholds:
  event_retention_days: 7
  personal_landing_max_hours: 23
  held_file_max_days: 7

bindings:
  mover:
    approach: cloud-native
    adapter: "Azure Data Factory copy activities (database full copy, files, REST pulls), its change data capture resource where the source fits (public preview: SQL Server, Azure SQL Database, Azure SQL Managed Instance, Azure Cosmos DB), and Azure Storage SFTP for partner drops; each writes landing to the landing contract (ADR-033). NOT BUILT: no generator for this cloud exists in the platform repository (the older Data Factory generator belongs to the earlier framework and was never run on a real factory)"
    coverage: partial
    gap: The change data capture resource is in preview and covers few database engines; a source whose log it cannot read (for example other relational engines) has no managed log reader that writes landing files; none of the offering writes a row-count manifest.
    gap_filled_by: {approach: open-source, adapter: "an open-source log reader (Debezium) reading the source log into the event hub's Kafka-compatible endpoint, and a small in-house step that writes the manifest and starts the lander; not yet validated on this cloud"}
    metadata_keys: [extraction_mode, file_pattern, schedule_trigger]
    proves: []
  landing_store:
    approach: cloud-native
    adapter: "Azure Data Lake Storage Gen2, container landing in the environment's storage account (a separate account for personal data with a 23-hour purge), read by the engine through a storage credential the engine layer registers. BUILT: dataplatform.adapters.azure_blob.AzureLanding, tested against a fake of the storage SDK surface only"
    coverage: full
    metadata_keys: [target_path_template, lifecycle_delete_days]
    proves: [DUP-02, ORCH-01]
  stream_bus:
    approach: cloud-native
    adapter: "Azure Event Hubs (Standard tier keeps events 7 days; Premium and Dedicated up to 90), read partition by partition through the SDK from a checkpoint the platform keeps. NOT BUILT: no stream adapter for this cloud exists"
    coverage: full
    settings: {retention_days: 7}
    proves: []
  tokenizer:
    approach: in-house
    adapter: "the lander's tokeniser with the token vault in its own database of the engine's managed PostgreSQL; Microsoft Purview classification scans find personal data in landing storage"
    coverage: partial
    gap: Purview classification finds personal data but does not tokenise it or run erasure.
    gap_filled_by: {approach: in-house, adapter: "dataplatform.pii (tokeniser, vault, suppression list, erasure flow)"}
    metadata_keys: [processor_groups.pii]
    proves: []
  telemetry:
    approach: cloud-native
    adapter: Azure Monitor (a Log Analytics workspace, metrics and action groups for paging)
    coverage: partial
    gap: Azure Monitor sees the cloud services, not the data; freshness and data alerts come from the engine side.
    gap_filled_by: {approach: in-house, adapter: "dataplatform.ops (joins Azure Monitor into the ops tables)"}
    proves: []
  cost_ledger:
    approach: cloud-native
    adapter: Microsoft Cost Management exports with tags, and budgets
    coverage: partial
    gap: The bill is per service and tag, not per dataset or data product.
    gap_filled_by: {approach: in-house, adapter: "dataplatform.ops cost split"}
    proves: []
  secret_store:
    approach: cloud-native
    adapter: "Azure Key Vault with role-based access, read by managed identities; the engine's secret scopes are backed by it. BUILT: dataplatform.adapters.secrets.AzureKeyVault, tested against a fake of the SDK surface only"
    coverage: full
    proves: [REL-05]
  identity_provider:
    approach: cloud-native
    adapter: Microsoft Entra ID groups and managed identities for services, provisioned to the engine's account groups
    coverage: full
    proves: []
  key_manager:
    approach: cloud-native
    adapter: Azure Key Vault (Premium or managed HSM), one customer-managed key per storage account, the metadata store and the vault
    coverage: full
    proves: []
  network_boundary:
    approach: cloud-native
    adapter: virtual network injection for the engine's compute, Private Link for storage and Key Vault, no public data paths
    coverage: full
    proves: []
  object_store:
    approach: cloud-native
    adapter: "Azure Data Lake Storage Gen2, one storage account per environment and one container per layer (abfss://<layer>@<account>.dfs.core.windows.net/). BUILT: dataplatform.adapters.azure_blob.AzureObjectStore, tested against a fake only"
    coverage: partial
    gap: Blob versioning on a storage account with a hierarchical namespace is not confirmed (container soft delete is supported), and versioning is an account setting the data-plane client cannot read, so versioned() asks the management plane.
    gap_filled_by: {approach: in-house, adapter: "dataplatform.retention and the table format's own history (ADR-029) carry the recovery targets until versioning is confirmed on a real account"}
    proves: [ORCH-05]
  compute_pool:
    approach: cloud-native
    adapter: Azure virtual machines under classic compute (only where serverless is not available)
    coverage: full
    proves: []
  event_publisher:
    approach: cloud-native
    adapter: Azure Event Grid custom topics, one schema per event contract
    coverage: partial
    gap: Event Grid delivers events but does not stop a rerun publishing them again.
    gap_filled_by: {approach: in-house, adapter: "dataplatform.events (stable event id, publish log)"}
    proves: []
  audit_log:
    approach: cloud-native
    adapter: Azure Activity Log and Microsoft Entra audit logs, sent to the Log Analytics workspace
    coverage: full
    proves: []
  infra_provisioner:
    approach: open-source
    adapter: "Terraform with the azurerm and engine providers (subscription, network, storage accounts, Key Vault, event hubs, Data Factory). NOT BUILT: the repository's infrastructure modules are for the first cloud only"
    coverage: full
    proves: []
accepted_gaps:
  - {obligation: ORCH-06, reason: "No stream adapter exists for this cloud, so a stream's restart from its checkpoint and its retention are not tested here; the first cloud's stand-in is the only proof", owner: platform owner, review: "2026-12-15"}
  - {obligation: DUP-04, reason: "A replayed stream event is dropped by its id in silver, tested on the engine, but not through this cloud's stream service because no adapter exists", owner: platform owner, review: "2026-12-15"}
  - {obligation: REL-06, reason: "No infrastructure module exists for this cloud; the repository's modules cover the first cloud only", owner: platform owner, review: "2026-12-15"}
  - {obligation: SEC-02, reason: "Keys, network boundary and encryption are specified here but nothing has been deployed or checked on a real subscription", owner: platform owner, review: "2026-12-15"}
  - {obligation: ENV-02, reason: "Identity and group provisioning to the engine is specified here but has not been run on a real tenant", owner: platform owner, review: "2026-12-15"}
