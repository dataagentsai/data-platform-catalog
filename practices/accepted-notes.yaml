# Linter notes that are intended, each with its reason (scripts/lint_practices.py). A listed note is not printed;
# a listed note that no longer fires is an error, so this list cannot go stale. Delete an entry once its cause is
# fixed. Two kinds:
#   {practice, check, reason}  the practice cites a shift-left check whose `dac:` links it does not share
#   {dac, reason}              no practice serves this DAC obligation yet
# A reason that starts "Bundle:" means the real fix is a `dac:` link in the shift-left bundle's check, not here.

# ---- the check makes this practice's own logic tested; the practice serves its own obligation, not TEST-03
