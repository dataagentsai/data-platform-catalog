# Clinical trial, slice 3: Subject dimension (gold). ODCS v3.2.0, adopted not restated (validated by tests/test_clinical.py).
apiVersion: v3.2.0
kind: DataContract
id: clinical-gold-dim-subject
name: "Subject dimension (gold)"
version: 0.1.0
status: draft
domain: operations
description:
  purpose: "Subjects as of any date, with reserved members -1 (unknown) and -2 (not applicable)."
  limitations: "From silver subjects; the subject identifier is the token silver holds. No treatment group: gold is blinded."
schema:
  - name: dim_subject
    physicalName: gold_operations.dim_subject
    logicalType: object
    dataGranularityDescription: "One row per subject per version, plus the reserved members"
    properties:
      - {name: "subject_sk", logicalType: "integer", required: true, primaryKey: true, primaryKeyPosition: 1}
      - {name: "subject_id", logicalType: "string", required: true, classification: "restricted", description: "The token silver holds for the subject identifier."}
      - {name: "site_id", logicalType: "string", required: true}
      - {name: "cohort", logicalType: "string", required: true}
      - {name: "subject_status", logicalType: "string", required: true}
      - {name: "valid_from", logicalType: "timestamp", required: true}
      - {name: "valid_to", logicalType: "timestamp", required: true}
      - {name: "is_current", logicalType: "boolean", required: true}
    quality:
      - {"type": "library", "metric": "duplicateValues", "arguments": {"properties": ["subject_sk"]}, "mustBe": 0, "dimension": "uniqueness", "severity": "critical"}
team:
  name: clinical-operations-data
  members:
    - {username: clinical-operations-data, role: owner}
slaProperties:
  - {property: latency, value: 24, unit: h}
  - {property: retention, value: 15, unit: y}
