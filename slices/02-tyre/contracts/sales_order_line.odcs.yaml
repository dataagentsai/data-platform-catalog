# Tyre company, slice 2: ERP sales order lines (silver). ODCS v3.2.0, adopted not restated (validated by tests/test_tyre.py).
apiVersion: v3.2.0
kind: DataContract
id: tyre-erp-sales-order-line
name: "ERP sales order lines (silver)"
version: 0.2.0
status: draft
domain: sales
description:
  purpose: "One row per sales order line per version, with the promised date and quantity tracked (type 2) for OTIF."
  limitations: "Sell-in only; dealer sell-out comes from partner files."
schema:
  - name: sales_order_line
    physicalName: silver_erp.sales_order_line
    logicalType: object
    dataGranularityDescription: "One row per order line per version; one current row per line"
    properties:
      - {name: "order_id", logicalType: "string", required: true, primaryKey: true, primaryKeyPosition: 1}
      - {name: "line_no", logicalType: "integer", required: true, primaryKey: true, primaryKeyPosition: 2}
      - {name: "dealer_code", logicalType: "string", required: true}
      - {name: "material_code", logicalType: "string", required: true}
      - {name: "plant_code", logicalType: "string", required: true, quality: [{"type": "library", "metric": "invalidValues", "arguments": {"validValues": ["P-CHN", "P-HUN"]}, "mustBe": 0, "dimension": "conformity", "severity": "major"}]}
      - {name: "order_ts", logicalType: "timestamp", required: true, description: "When the order was placed, in UTC; the plant's local time is added beside it."}
      - {name: "promised_date", logicalType: "date", required: true, description: "The date first promised to the dealer; a change opens a new version."}
      - {name: "ordered_qty", logicalType: "integer", required: true, quality: [{"type": "sql", "description": "ordered_qty is never negative.", "query": "SELECT COUNT(*) FROM ${object} WHERE ordered_qty < 0", "mustBe": 0, "dimension": "accuracy", "severity": "critical"}]}
      - {name: "net_value", logicalType: "number", required: true, quality: [{"type": "sql", "description": "net_value is never negative.", "query": "SELECT COUNT(*) FROM ${object} WHERE net_value < 0", "mustBe": 0, "dimension": "accuracy", "severity": "critical"}]}
      - {name: "currency", logicalType: "string", required: true}
      - {name: "line_status", logicalType: "string", required: true, description: "open, cancelled or rejected. A cancelled or rejected line keeps its quantity and value; OTIF leaves it out.", quality: [{"type": "library", "metric": "invalidValues", "arguments": {"validValues": ["open", "cancelled", "rejected"]}, "mustBe": 0, "dimension": "conformity", "severity": "major"}]}
      - {name: "rejection_reason", logicalType: "string", required: false, description: "Why the line was rejected; set only when line_status is rejected.", quality: [{"type": "sql", "description": "A rejected line has a reason and no other line has one.", "query": "SELECT COUNT(*) FROM ${object} WHERE (line_status = 'rejected') <> (rejection_reason IS NOT NULL)", "mustBe": 0, "dimension": "consistency", "severity": "major"}]}
      - {name: "change_seq", logicalType: "integer", required: true, description: "The source's change sequence; history is ordered by it (DPC-0025)."}
    quality:
      - {"type": "library", "metric": "duplicateValues", "arguments": {"properties": ["order_id", "line_no", "change_seq"]}, "mustBe": 0, "dimension": "uniqueness", "severity": "critical"}
      - {"type": "library", "metric": "rowCount", "mustBeGreaterThan": 0, "dimension": "completeness", "severity": "critical"}
team:
  name: sales-data
  members:
    - {username: sales-data@tyre.example, role: owner}
slaProperties:
  - {property: latency, value: 1, unit: h}
  - {property: retention, value: 10, unit: y}
