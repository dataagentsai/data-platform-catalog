# Tyre company, slice 2: Press dimension (gold). ODCS v3.2.0, adopted not restated (validated by tests/test_tyre.py).
apiVersion: v3.2.0
kind: DataContract
id: tyre-gold-dim-press
name: "Press dimension (gold)"
version: 0.1.0
status: draft
domain: manufacturing
description:
  purpose: "Presses as of any date, with plant and ideal cycle time, and reserved members."
  limitations: "From silver presses."
schema:
  - name: dim_press
    physicalName: gold_manufacturing.dim_press
    logicalType: object
    dataGranularityDescription: "One row per press per version, plus the reserved members"
    properties:
      - {name: "press_sk", logicalType: "integer", required: true, primaryKey: true, primaryKeyPosition: 1}
      - {name: "press_id", logicalType: "string", required: true}
      - {name: "plant_code", logicalType: "string", required: true}
      - {name: "ideal_cycle_seconds", logicalType: "integer", required: true}
      - {name: "valid_from", logicalType: "timestamp", required: true}
      - {name: "valid_to", logicalType: "timestamp", required: true}
      - {name: "is_current", logicalType: "boolean", required: true}
    quality:
      - {"type": "library", "metric": "duplicateValues", "arguments": {"properties": ["press_sk"]}, "mustBe": 0, "dimension": "uniqueness", "severity": "critical"}
team:
  name: manufacturing-data
  members:
    - {username: manufacturing-data@tyre.example, role: owner}
slaProperties:
  - {property: latency, value: 24, unit: h}
  - {property: retention, value: 10, unit: y}
