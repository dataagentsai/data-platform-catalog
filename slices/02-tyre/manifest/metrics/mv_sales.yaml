# Known answers are the tyre world's seed-11 values after its 14-day run (9 to 22 November), from the oracle's last day.
# Sell-in is asked for November: the clock starts on 9 November, so the world places no October orders.
# Sell-out stays on October: days 1 to 5 of the clock are October's partner-file window (world.yaml).
kind: metric_view
name: mv_sales
domain: sales
source: fact_sales
joins: [dim_dealer, dim_material]
dimensions:
  - {name: Month, expr: sale_month}
  - {name: Region, expr: dim_dealer.region}
  - {name: Tyre class, expr: dim_material.tyre_class}
measures:
  - name: Sell-in units
    expr: SUM(units_sold_in)
    additive: true
    time_dimension: Month
    certification: certified
    synonyms: [sell in, shipments to dealers, primary sales]
    known_answer: {where: "month = 2026-11 AND region = 'north'", value: 1279642}
  - name: Sell-out units
    expr: SUM(units_sold_out)
    additive: true
    time_dimension: Month
    certification: certified
    synonyms: [sell out, retail sales, secondary sales]
    known_answer: {where: "month = 2026-10 AND region = 'north'", value: 150803}
  - name: Net sales value
    expr: SUM(net_value)
    additive: true
    time_dimension: Month
    certification: draft
    synonyms: [revenue, sales value]
owners: {dataset: sales-data@tyre.example}
