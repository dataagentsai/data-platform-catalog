# DBS v0.1: the Databricks binding for slice 1. Product names are allowed here and nowhere else.
#
# Format: dbs/README.md. It is the AI family's harness profile (six blocks) plus, on every binding, what the
# binding rule needs: how much the product covers the port (full, partial, none), the gap, who fills it, and the
# metadata keys that switch and configure it. Built and checked against data-platform-framework branch slice1.
#
# "How to do it and how to verify it" per obligation already lives in data-project-review/bindings/databricks.yaml
# (checked against the docs on 2026-11-01); `proves` points at those entries by DAC id instead of copying them.
apiVersion: data-binding/v0.1
subject:
  name: shop orders, slice 1
  platform: Databricks Free Edition (serverless, one workspace)
  archetypes: [PA2]
catalog:
  dac: 0.1.0
  dpc: 0.1.0
decisions:
  D6: {value: "Service A silver on Lakeflow Declarative Pipelines", source: chosen}
  D11: {value: "mover swappable; lander is our own code", source: chosen}
  environments: {value: "one schema set per environment (dp_<env>_*), since Free Edition has one workspace", source: chosen}
thresholds:
  quarantine_stop_share: 0.01
  freshness_warn_hours: 4
  freshness_error_hours: 8

bindings:
  mover:
    approach: platform
    adapter: the world writes files into a Unity Catalog volume (stands in for Auto Loader or Lakeflow Connect)
    coverage: full
    metadata_keys: [file_pattern, schedule_trigger]
    proves: [DUP-01]
  landing_store:
    approach: platform
    adapter: Unity Catalog volume, one folder per source, dataset and window, read as files (dataplatform.adapters.files)
    coverage: full
    proves: [DUP-01]
  table_writer:
    approach: platform
    adapter: Lakeflow Declarative Pipelines AUTO CDC, STORED AS SCD TYPE 2, SEQUENCE BY change_seq, apply_as_deletes op = 'D'
    coverage: partial
    gap: AUTO CDC needs a batch key and load columns it does not make, and does not refuse a resend.
    gap_filled_by: {approach: in-house, adapter: "dataplatform.lander (batch key, load columns, resend skipped)"}
    metadata_keys: [load.pattern, load.history_order_by, load.deletes, dedup.business_keys]
    proves: [DUP-01, DUP-02, SCD-02, DEL-01, HIST-04]
  contract_enforcer:
    approach: in-house
    adapter: dataplatform.contract.check_columns against the ODCS file, before bronze
    coverage: none
    gap: Delta schema enforcement stops a write but does not read an ODCS contract or name the missing column.
    gap_filled_by: {approach: in-house, adapter: dataplatform.contract}
    metadata_keys: [contract, contract_version, load.new_columns]
    proves: [SCH-01, SCH-02]
  quarantine:
    approach: platform
    adapter: a pipeline table fed by the inverse of the expectations, with the failed rule names as a column
    coverage: partial
    gap: Expectations drop or count rows but do not keep them with the rule names.
    gap_filled_by: {approach: in-house, adapter: realms/databricks/pipelines/silver.py quarantine table}
    metadata_keys: [load.quarantine_stop_share]
    proves: [DQ-02]
  quality_runner:
    approach: platform
    adapter: pipeline expectations (expect_all_or_drop), rules read from the metadata DB table quality_rules
    coverage: partial
    gap: Expectations report a pass on zero rows, and table-level rules (duplicates, row count) are not row rules.
    gap_filled_by: {approach: in-house, adapter: "realms/databricks/tasks/checks.py (rowCount, duplicateValues)"}
    metadata_keys: [quality_rules (compiled from the contract)]
    proves: [DQ-02, DQ-04, GATE-01]
  reconciler:
    approach: in-house
    adapter: dataplatform.reconcile, source to bronze per run, results in check_results
    coverage: none
    gap: No product reconciles counts and totals across hops and names the hop.
    gap_filled_by: {approach: in-house, adapter: dataplatform.reconcile}
    metadata_keys: [reconciliation.hops, reconciliation.measures, reconciliation.tolerance]
    proves: [REC-01, REC-05]
  lineage_emitter:
    approach: platform
    adapter: Unity Catalog lineage, captured automatically for every table written
    coverage: full
    proves: [LIN-01]
  telemetry:
    approach: platform
    adapter: Lakeflow Jobs run history and pipeline event log
    coverage: partial
    gap: Freshness against the contract's latency is not measured; no alert is sent.
    gap_filled_by: {approach: in-house, adapter: not built in slice 1 (accepted gap)}
    metadata_keys: [sla_freshness_hours, sla_freshness_error_hours]
    proves: [OPS-01]
  run_log:
    approach: in-house
    adapter: run_log Delta table in the metadata schema, one row per step, with the config fingerprint
    coverage: none
    gap: Job run history does not record which config a run used.
    gap_filled_by: {approach: in-house, adapter: dataplatform.adapters.spark_delta.SparkRunLog}
    proves: [OPS-03, CFG-03]
  metadata_service:
    approach: in-house
    adapter: Delta tables in dp_<env>_meta; compiled manifest loaded by the prepare step only when its fingerprint changes
    coverage: none
    gap: No product holds a dataset manifest that pipelines read at run time.
    gap_filled_by: {approach: in-house, adapter: dataplatform.adapters.spark_delta.SparkMeta}
    proves: [CFG-01, CFG-02]
  orchestrator:
    approach: platform
    adapter: Lakeflow Jobs, one run per world day, max concurrent runs 1, run id passed to every task
    coverage: full
    metadata_keys: [schedule_trigger, schedule_timezone]
    proves: [ORCH-01, ORCH-02]
  secret_store:
    approach: platform
    adapter: Databricks secret scopes (not needed in slice 1; the world is inside the workspace)
    coverage: full
    proves: [REL-05]
  clock:
    approach: in-house
    adapter: the world day is a job parameter; production would pass the real date
    coverage: none
    gap: No product lets a job run on a simulated date.
    gap_filled_by: {approach: in-house, adapter: job parameter day}
    proves: [LATE-04]
  semantic_layer:
    approach: platform
    adapter: Unity Catalog metric view orders_metrics (dimensions order_date, status, store_id; measures orders, revenue)
    coverage: full
    proves: [SERV-04]
  evidence:
    approach: in-house
    adapter: evidence view joining run_log and check_results by run id
    coverage: none
    gap: Each Databricks feature reports alone; nothing answers "is this number right, and how do we know?" for one run.
    gap_filled_by: {approach: in-house, adapter: dataplatform.adapters.spark_delta.create_meta (evidence view)}
    proves: [SIM-01]

accepted_gaps:
  - {obligation: GATE-02, reason: "Protected contract files are a Git branch-protection setting, outside the platform.", owner: platform-lead, review: "2026-12-01"}
  - {obligation: SCH-01, reason: "New columns are reported but not kept in bronze yet (load.new_columns: hold_in_bronze is not built).", owner: platform-lead, review: "2026-12-01"}
  - {obligation: OPS-01, reason: "Freshness is not measured against the contract's latency and no alert is sent in slice 1.", owner: platform-lead, review: "2026-12-01"}
