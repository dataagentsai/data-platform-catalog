proposed:
- key: sla_freshness_error_hours
  why: The registry has one freshness threshold (sla_freshness_hours, used as the warning); the contract needs a
    second, the error threshold (FRESH-01).
  add_to_registry: DE-037
- key: schedule_trigger
  why: 'The registry schedules by cron only; slice 1 starts a load when the delivery manifest exists (DPC-0004).
    Values: cron | on_delivery.'
  add_to_registry: DE-037
