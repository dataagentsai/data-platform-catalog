- id: REL-03
  status: draft
  since: 0.1.0
  title: Automated promotion of the same build
  concern: X16
  level: MUST
  core: false
  dimension: null
  stages:
  - platform
  statement: The same build MUST be promoted from test to production by the pipeline, with no manual change in the
    target environment.
  failure_mode: Each environment was deployed by copying scripts by hand; production ended up with an older version
    of one script, and test results said nothing about what really ran.
  test: Deploy the thin slice to test using only the pipeline, with nobody clicking in the target environment.
  evidence: A pipeline that builds once, deploys the same version to each environment with environment settings
    injected, and records which version is where.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Storage and Operations, chapter 6
  review_check: REL-03
  related:
  - REL-01
  - REL-04
  - REL-07
  enforced_by:
    shift_left:
    - SL-DEP-02
    proposed: []
    runtime: true
    review: null
    gap: null
- id: REL-04
  status: draft
  since: 0.1.0
  title: Configuration per environment, not in code
  concern: X16
  level: MUST
  core: false
  dimension: null
  stages:
  - platform
  statement: Environment-specific values MUST come from configuration, never from code.
  failure_mode: A storage path to production was hard-coded in a shared module; tests in development read and then
    overwrote production data.
  test: Search the code for production host names, paths and catalog names; each hit is a defect.
  evidence: A configuration file or variable set per environment, and code that reads all environment values from
    it.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Storage and Operations, chapter 6
  review_check: REL-04
  related:
  - REL-03
  - REL-05
  - ENV-01
  enforced_by:
    shift_left:
    - SL-CLEAN-07
    - SL-SECRET-03
    proposed:
    - SL-CLEAN-33
    runtime: true
    review: null
    gap: null
- id: REL-06
  status: draft
  since: 0.1.0
  title: Infrastructure defined as code
  concern: X16
  level: SHOULD
  core: false
  dimension: null
  stages:
  - platform
  statement: Infrastructure SHOULD be defined as code, so an environment can be rebuilt from the repository.
  failure_mode: The test environment was built by hand months after production and differed in network and permission
    settings, so tests passed that failed in production.
  test: Build a throwaway environment from the infrastructure code alone and compare its settings with test.
  evidence: Infrastructure code in version control covering workspaces, storage, networks, identities, policies
    and grants, applied through a pipeline.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Storage and Operations, chapter 6
  review_check: REL-06
  related:
  - REL-01
  - ENV-01
  enforced_by:
    shift_left:
    - SL-SETUP-06
    proposed: []
    runtime: true
    review: null
    gap: null
