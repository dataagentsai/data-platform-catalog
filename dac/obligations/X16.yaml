# DAC obligations for X16, Environments, CI/CD and release. Normative: edit here.
- id: ENV-01
  status: draft
  since: 0.1.0
  title: Separate environments with separate data
  concern: X16
  level: MUST
  core: true
  dimension: null
  stages:
  - platform
  statement: Development and test identities MUST NOT be able to write to production data.
  failure_mode: A developer ran a cleanup script pointed at what they thought was development; the paths were shared
    and production tables were wiped the night before a board meeting.
  test: Using a development identity, try to write to a production table; it must be refused.
  evidence: Named environments with separate storage, catalogs or schemas, identities and compute, and a rule that
    non-production identities cannot write to production.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Security, chapter 7
  review_check: ENV-01
  related:
  - ENV-02
  - REL-04
  enforced_by:
    shift_left:
    - SL-COST-CONFIG-07
    - SL-DEP-05
    proposed: []
    runtime: true
    review: null
    gap: null
- id: REL-01
  status: draft
  since: 0.1.0
  title: Everything that runs is in version control
  concern: X16
  level: MUST
  core: true
  dimension: null
  stages:
  - platform
  statement: Everything that runs in production (code, configuration, contracts, schedules) MUST be recreatable
    from version control alone.
  failure_mode: The schedule and parameters were edited by hand in the production interface; when the job was recreated
    after an incident, nobody knew the real settings and it ran with wrong ones for a week.
  test: Pick one production job and try to recreate it in a fresh environment only from the repository.
  evidence: A repository layout that includes code, job and schedule definitions and configuration, and a rule that
    production is never changed by hand.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Storage and Operations, chapter 6
  review_check: REL-01
  related:
  - REL-02
  - REL-03
  - REL-06
  enforced_by:
    shift_left:
    - SL-DEP-01
    - SL-DEP-02
    - SL-DEP-04
    - SL-DEP-06
    - SL-SETUP-09
    proposed: []
    runtime: true
    review: null
    gap: null
- id: REL-02
  status: draft
  since: 0.1.0
  title: Branching and code review
  concern: X16
  level: MUST
  core: false
  dimension: null
  stages:
  - platform
  statement: Changes to the main branch MUST go through review; direct pushes MUST be refused.
  failure_mode: A developer pushed a join change straight to the main branch on a Friday; it removed a filter, and
    the weekend loads double-counted refunds.
  test: Try to push directly to the main branch; it should be refused.
  evidence: A short branching model, protected main branch, required reviewer, and automated tests and linting run
    on every pull request.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Governance, chapter 3
