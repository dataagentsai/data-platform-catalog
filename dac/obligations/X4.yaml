- id: PUB-01
  status: draft
  since: 0.1.0
  title: Derived tables pass their own checks before publish
  concern: X4
  level: MUST
  core: true
  dimension: consistency
  stages:
  - gold
  statement: A derived table MUST pass its own checks before a new version is published (grain unique, unmatched
    reference rows under a declared limit, totals reconciled to its inputs, every input complete for the window);
    on failure the last good version MUST stay published.
  failure_mode: Silver checks were all green, but a join on a non-unique key doubled one plant's sales in gold;
    the board pack went out with it because nothing checked gold itself.
  test: Plant a duplicate grain key, an unmatched reference row above the limit and a missing input window in test;
    each must block publish and leave the previous version in place.
  evidence: Check results per publish, and a blocked publish in the log with the previous version still served.
  cites:
  - standard: ODCS
    ref: quality[]
  - standard: DAMA-DMBOK
    ref: Data Quality, chapter 13
  related:
  - DES-04
  - LATE-02
  - REC-01
  - ORCH-01
  review_check: null
  origin: deck
  enforced_by:
    shift_left: []
    proposed:
    - SL-GOLD-04
    runtime: true
    review: The owner sets the unmatched-row limit and tolerance for each derived table.
    gap: null
- id: QUAR-01
  status: draft
  since: 0.1.0
  title: A released row goes through the same checks again
  concern: X4
  level: MUST
  core: false
  dimension: null
  stages:
  - silver
  statement: A quarantined row released after a fix MUST re-enter through the same stages and rules as a new row,
    and MUST NOT be written to silver directly.
  failure_mode: A steward released a batch of quarantined orders straight into silver after fixing the date format;
    the rows skipped de-duplication and three hundred orders were counted twice.
  test: Quarantine rows, fix them and release them in test; they must pass every stage again, and a release that
    still breaks a rule must go back to quarantine.
  evidence: Released rows in the run log with the stages they passed, and their quarantine and release records linked.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Quality, chapter 13
  related:
  - DQ-02
  - SEV-01
  review_check: null
  origin: deck
  enforced_by:
    shift_left: []
    proposed: []
    runtime: true
    review: null
