- id: SCD-04
  status: draft
  since: 0.1.0
  title: Facts joined to the right version of history
  concern: X4
  level: SHOULD
  core: false
  dimension: accuracy
  stages:
  - gold
  statement: Facts SHOULD be joined to the version of a dimension that was valid at the fact's business date, unless
    the dataset declares otherwise.
  failure_mode: Facts were joined to the current customer row; reports that should show sales by the region at the
    time showed today's region instead, and nobody had written down which was wanted.
  test: Take one customer who changed region last year and check a sales report shows each sale under the region
    the business expects.
  evidence: For each report, whether it shows "as it was" or "as it is now", and joins that use the fact date within
    the validity range or the surrogate key captured at load.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Warehousing and Business Intelligence, chapter 11
  review_check: SCD-04
  related:
  - SCD-02
  - SERV-04
  enforced_by:
    shift_left: []
    proposed: []
    runtime: true
    review: Review of the join conditions for every dimension that keeps history.
    gap: 'No build-time check yet: found only by the runtime test.'
- id: SEV-01
  status: draft
  since: 0.1.0
  title: A rule's severity decides what happens on failure
  concern: X4
  level: MUST
  core: true
  dimension: null
  stages:
  - bronze
  - silver
  - gold
  statement: Every quality rule MUST declare a severity, and the severity MUST decide the action on failure (record
    and warn, quarantine the row, or block the batch and its successors), the same way in every pipeline.
  failure_mode: Two pipelines ran the same not-null rule; one quarantined the rows and the other only warned, so
    the same bad customer rows were missing from one report and present in the other.
  test: Run one failing row for each severity through two different datasets; each severity must give the same action
    in both, and a block must hold the next batch until it is cleared.
  evidence: The severity-to-action table, and quality results showing the action taken per rule and run.
  cites:
  - standard: ODCS
    ref: quality[].severity
  related:
  - DQ-01
  - DQ-02
  - QUAR-01
  review_check: null
  origin: deck
  enforced_by:
    shift_left: []
    proposed: []
    runtime: true
    review: null
