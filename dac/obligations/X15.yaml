- id: RAW-01
  status: draft
  since: 0.1.0
  title: The first kept layer holds every record as delivered
  concern: X15
  level: MUST
  core: true
  dimension: null
  stages:
  - landing
  - bronze
  statement: The first kept layer MUST hold every record as delivered, append-only and unchanged apart from personal-data
    protection, so every later layer can be rebuilt by replay.
  failure_mode: Bronze dropped duplicates on load; a de-duplication bug removed real repeat orders, and since bronze
    no longer held them no replay could bring them back.
  test: Deliver a batch with duplicates and odd values; bronze must hold them all, unchanged, and a later delivery
    must not update or delete them.
  evidence: Write rights on bronze limited to append by the entry process, and a replay that rebuilds silver from
    it.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Storage and Operations, chapter 6
  related:
