- id: KEY-01
  status: draft
  since: 0.1.0
  title: Surrogate keys are the same on every rebuild
  concern: X15
  level: MUST
  core: false
  dimension: consistency
  stages:
  - gold
  statement: A surrogate key MUST be computed from the source and the business key (and the validity start for kept
    history), so a rebuild in any environment gives every row the same key; reserved keys MUST mark unknown and
    not applicable members.
  failure_mode: Keys came from a sequence; a rebuild renumbered every customer, and saved filters and extracts that
    held old keys now pointed at different customers.
  test: Build a table twice in two environments from the same input; every key must match, and an unmatched reference
    must get the reserved unknown key.
  evidence: The key rule per table, and a comparison of two builds.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Warehousing and Business Intelligence, chapter 11
  related:
  - DES-04
  - LATE-02
  - SCD-04
  review_check: null
  origin: deck
  enforced_by:
    shift_left: []
    proposed:
    - SL-GOLD-02
    runtime: true
    review: Review of the key rule of every new derived table.
    gap: null
- id: LATE-01
  status: draft
  since: 0.1.0
  title: Late and corrected rows rebuild the right periods
  concern: X15
  level: MUST
  core: true
  dimension: timeliness
  stages:
  - silver
  - gold
  statement: A late or corrected row MUST cause every period it affects to be rebuilt, within a declared look-back
    window, and nothing outside it.
  failure_mode: Returns were booked against sales from three weeks earlier, but the pipeline only rebuilt the last
    two days, so monthly net revenue never matched the finance ledger.
  test: In a real extract, compare business date against load date and find the longest lag; then insert a row two
    weeks late in test and check the monthly total updates.
  evidence: A profile of how late data really arrives, an agreed correction window, and a design that reprocesses
    affected periods by business date rather than load date.
  cites:
  - standard: ODCS
    ref: slaProperties[].property = latency
  review_check: LATE-01
  related:
  - LATE-02
  - HIST-04
  - REC-01
  enforced_by:
    shift_left:
    - SL-CLEAN-16
    proposed: []
    runtime: true
    review: null
    gap: null
- id: ORCH-03
  status: draft
  since: 0.1.0
  title: Restart after failing in the middle
  concern: X15
  level: MUST
  core: true
  dimension: null
  stages:
  - bronze
  - silver
  - gold
  statement: A job killed while writing and then restarted MUST produce the same output as a run that was never
    interrupted.
  failure_mode: A job failed after updating three of five tables; reports joined new facts to old dimensions, and
    rerunning from the start re-applied the first three updates.
  test: Kill a job in test while it is writing, then restart it; outputs must match an uninterrupted run.
  evidence: Atomic writes per table, a defined restart point per step, consumers reading only completed runs, and
    a failure-injection test.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Storage and Operations, chapter 6
