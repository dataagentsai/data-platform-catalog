- id: IDEMP-01
  status: draft
  since: 0.1.0
  title: Each layer declares what makes its write idempotent
  concern: X15
  level: MUST
  core: true
  dimension: uniqueness
  stages:
  - landing
  - bronze
  - silver
  - gold
  - semantic
  statement: Each layer MUST declare the key that makes its writes safe to repeat (file fingerprint, batch id, business
    key with change order, window or grain key, definition version), and every write MUST use it.
  failure_mode: Bronze guarded against resent files but silver merged on a key without change order; a replay applied
    old changes over new ones and history went backwards.
  test: Repeat one delivery through every layer; each layer must reject or absorb the repeat by its declared key.
  evidence: The declared key per layer, and the replay test result per layer.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Storage and Operations, chapter 6
  related:
  - DUP-01
  - DUP-02
  - GOLD-01
  review_check: null
  origin: deck
  enforced_by:
    shift_left: []
