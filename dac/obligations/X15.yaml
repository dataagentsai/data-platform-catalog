# DAC obligations for X15, Replay, backfill and idempotency. Normative: edit here.
- id: DUP-01
  status: draft
  since: 0.1.0
  title: Same batch or file arriving twice
  concern: X15
  level: MUST
  core: true
  dimension: uniqueness
  stages:
  - landing
  - bronze
  - silver
  - gold
  statement: A file or batch delivered a second time MUST NOT change the row count or any key total in any layer.
  failure_mode: After an outage the source resent yesterday's file, the pipeline loaded it again as new, and revenue
    on the dashboard doubled for a day before anyone noticed.
  test: Load the same file twice in a test environment; row counts and key totals in every layer must not change
    after the second load.
  evidence: A business key or file fingerprint, a record of what has already been loaded, and a test that loads
    the same input twice.
  cites:
  - standard: ODCS
    ref: quality[].metric = duplicateValues
  - standard: DAMA-DMBOK
    ref: Data Quality, chapter 13
  review_check: DUP-01
  related:
  - DUP-02
  - DUP-03
  - REC-01
  enforced_by:
    shift_left:
    - SL-SEM-04
    - SL-TEST-07
    - SL-TEST-09
    proposed: []
    runtime: true
    review: null
    gap: null
- id: DUP-02
  status: draft
  since: 0.1.0
  title: Rerunning a job leaves the result unchanged
  concern: X15
  level: MUST
  core: true
  dimension: uniqueness
  stages:
  - bronze
  - silver
  - gold
  statement: Running the same job twice for the same window MUST leave every output table with the same fingerprint
    (row count, key totals) as running it once.
  failure_mode: Operations reran a failed nightly job, but its first half had already appended rows, so the fact
    table held two copies of the night's orders until month-end reconciliation found them.
  test: Run the pipeline twice in a row for the same day in test and compare a fingerprint of every output table
    (counts, sums of key measures); they must be identical.
  evidence: Each write described as merge on a key, or replace of a whole partition or period, never a blind append;
    a rerun test per pipeline; the runbook says reruns are safe.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Quality, chapter 13
  review_check: DUP-02
  related:
  - DUP-01
  - ORCH-03
  - TEST-05
  enforced_by:
    shift_left: []
    proposed: []
    runtime: true
    review: null
    gap: 'No build-time check yet: found only by the runtime test.'
- id: DUP-04
  status: draft
  since: 0.1.0
  title: Replayed events in a stream
  concern: X15
  level: MUST
  core: false
  dimension: uniqueness
  stages:
  - bronze
  - silver
  statement: Events replayed by a stream after a restart or rewind MUST NOT be counted twice in any output.
  failure_mode: A consumer restarted from an older position and replayed two hours of events; the counts sink appended
    them again and the real-time dashboard overstated traffic for the day.
  test: In test, stop the stream mid-flow, rewind its position by a known number of events, restart, and confirm
    output counts match the input exactly.
  evidence: An event id or key plus sequence used to deduplicate, a stated delivery guarantee end to end, and an
    idempotent or transactional write to the sink.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Quality, chapter 13
  review_check: DUP-04
  related:
  - DUP-02
  - ORCH-06
  - LATE-03
  enforced_by:
    shift_left: []
    proposed: []
    runtime: true
    review: null
    gap: 'No build-time check yet: found only by the runtime test.'
- id: GOLD-01
  status: draft
  since: 0.1.0
  title: Derived tables are replaced by window, never appended
  concern: X15
  level: MUST
  core: true
  dimension: uniqueness
  stages:
  - gold
  statement: A write to a derived table MUST replace the affected window or merge on the grain key; an append write
    to a derived table MUST NOT be used.
  failure_mode: The daily sales fact appended its output; a retry after a timeout doubled one day's revenue, and
    the rerun the next morning tripled it.
  test: Run the same window twice and once with a late input; the table must equal a single clean run each time.
  evidence: The write mode per derived table, and the rerun test result.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Warehousing and Business Intelligence, chapter 11
  related:
  - DUP-02
  - LATE-01
  - IDEMP-01
  review_check: null
  origin: deck
  enforced_by:
    shift_left: []
    proposed:
    - SL-GOLD-01
    runtime: true
    review: null
    gap: null
- id: HIST-03
  status: draft
  since: 0.1.0
  title: Handing over from history load to incremental loads
  concern: X15
  level: MUST
  core: false
  dimension: completeness
  stages:
  - bronze
  - silver
  statement: The switch from the first full load to incremental loads MUST lose no change made at the source while
    the full load was running.
  failure_mode: The full snapshot finished at 10:00 but incremental capture was started at 11:00; an hour of changes
    was never loaded and the totals were quietly short for months.
  test: In test, change rows in the source while the full load runs, then start incremental; every changed row must
    appear once with its latest value.
  evidence: A defined high-water mark or change position taken before the snapshot starts, incremental capture starting
    from it, and overlapping rows absorbed by a merge on key.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Integration and Interoperability, chapter 8
  review_check: HIST-03
  related:
  - DUP-01
  - REC-01
  enforced_by:
    shift_left: []
    proposed: []
    runtime: true
    review: null
    gap: 'No build-time check yet: found only by the runtime test.'
- id: HIST-04
  status: draft
  since: 0.1.0
  title: Reloading or backfilling a past period
  concern: X15
  level: MUST
  core: true
  dimension: null
  stages:
  - bronze
  - silver
  - gold
  statement: Reloading a past window MUST be a parameter of the normal job, and MUST change only that window's rows
    and the derived rows that depend on it.
  failure_mode: A source bug corrupted three days in March; the only way to fix them was a full rebuild that took
    the platform down for a weekend.
  test: In test, reload one day from three days ago with a parameter and check that only that day's rows and its
    downstream aggregates changed.
  evidence: Pipelines parameterised by period, writes that replace exactly that period, a runbook step for reloading
    a period, and a note on which downstream tables must also be rebuilt.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Storage and Operations, chapter 6
  review_check: HIST-04
  related:
  - DUP-02
  - LATE-01
  enforced_by:
