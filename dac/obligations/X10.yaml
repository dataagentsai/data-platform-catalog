# DAC obligations for X10, Cost and FinOps. Normative: edit here.
- id: COST-02
  status: draft
  since: 0.1.0
  title: Platform cost guardrails
  concern: X10
  level: MUST
  core: false
  dimension: null
  stages:
  - platform
  statement: Budgets, alerts and compute limits MUST stop one team, job or user from spending beyond a declared
    limit unnoticed.
  failure_mode: A developer left a large compute cluster running over a holiday weekend, and the month's budget
    was gone by the fourth.
  test: Try to create the largest compute allowed as an ordinary developer in the development environment; the policy
    should stop you.
  evidence: Budgets with alerts per team or project, policies that cap compute size and enforce automatic shutdown,
    and a named person who receives cost alerts.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Governance, chapter 3
