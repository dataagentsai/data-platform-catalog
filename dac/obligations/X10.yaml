- id: COST-03
  status: draft
  since: 0.1.0
  title: Cost can be traced to a team and a job
  concern: X10
  level: MUST
  core: true
  dimension: null
  stages:
  - platform
  statement: Every unit of spend MUST be attributable to a team and a job; untagged spend MUST be reported.
  failure_mode: The platform bill doubled in one month and nobody could say which project caused it, so every team
    was asked to cut costs instead of the one that needed to.
  test: Pull last week's cost broken down by project tag; check how much is untagged.
  evidence: A mandatory tagging standard (project, owner, environment), enforced on compute and storage, and a cost
    report by tag.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Governance, chapter 3
  review_check: COST-03
  related:
  - COST-02
  - OPS-03
  enforced_by:
    shift_left:
    - SL-COST-CONFIG-03
    proposed: []
    runtime: true
    review: null
    gap: null
- id: COST-04
  status: draft
  since: 0.1.0
  title: No compute running when nothing needs it
  concern: X10
  level: SHOULD
  core: false
  dimension: null
  stages:
  - platform
  statement: Compute SHOULD NOT run when no work needs it; idle time per job SHOULD be measured.
  failure_mode: A job that needed ten minutes of compute held a large cluster for two hours each run because it
    waited on an upstream file, and nobody noticed for six months.
  test: For the three most expensive jobs, compare the time compute was running against the time it was busy.
  evidence: Compute sizes justified by measured runs, automatic stop or job-scoped compute, waits on upstream data
    done outside paid compute, and a periodic review of utilisation.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Storage and Operations, chapter 6
  review_check: COST-04
  related:
  - COST-02
  - PERF-05
  enforced_by:
    shift_left:
    - SL-COST-CODE-06
    - SL-COST-CONFIG-01
    - SL-COST-CONFIG-02
    - SL-COST-CONFIG-05
    - SL-COST-CONFIG-06
    proposed: []
    runtime: true
    review: null
    gap: null
