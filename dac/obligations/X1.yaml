# DAC obligations for X1, Metadata and control plane. Normative: edit here.
- id: CFG-01
  status: draft
  since: 0.1.0
  title: Everything that runs was declared
  concern: X1
  level: MUST
  core: true
  dimension: null
  stages:
  - platform
  statement: Every pipeline, table and check deployed MUST have a manifest entry that asked for it; the difference
    between what is deployed and what is declared MUST be reported.
  failure_mode: A hand-made table fed the finance report for a year; nobody knew it existed until its owner left.
  test: Diff the deployed inventory against the manifest; every undeclared object is a finding.
  evidence: The inventory diff, empty or with each finding owned.
  cites:
  - standard: DAMA-DMBOK
    ref: Metadata Management, chapter 12
  related:
  - CFG-02
  - CFG-03
  review_check: null
  plan_rule: R2
  enforced_by:
    shift_left:
    - SL-SETUP-06
    proposed:
    - SL-META-04
    runtime: true
    review: null
    gap: null
- id: CFG-02
  status: draft
  since: 0.1.0
  title: Cross-cutting concerns are on by default
  concern: X1
  level: MUST
  core: true
  dimension: null
  stages:
  - platform
  statement: Quality rules, lineage, reconciliation, cost tags and freshness monitoring MUST be on for every dataset
    by default; turning one off MUST need a waiver with a reason, an approver and an expiry.
  failure_mode: A new table went live with no quality rules because the template made them optional; it carried
    negative prices for a month.
  test: Declare a dataset with no settings; every concern must be on. Remove one; the validator must demand a waiver.
  evidence: The validator's rule, and the list of waivers with their expiry dates.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Governance, chapter 3
  related:
  - CFG-01
  review_check: null
  plan_rule: R5
  enforced_by:
    shift_left: []
    proposed:
    - SL-META-01
    runtime: true
    review: Every waiver needs a named approver and an expiry.
    gap: null
- id: CFG-04
  status: draft
  since: 0.1.0
  title: The control plane is changed only through its declared operations
  concern: X1
  level: MUST
  core: false
  dimension: null
  stages:
  - platform
  statement: Configuration, run records and watermarks in the control plane MUST be read and written only through
    its declared operations; a direct write to its tables MUST be refused.
  failure_mode: A job wrote its watermark with its own SQL, skipped the check that the load had succeeded, and the
    next run started after a day that was never loaded.
  test: Try a direct insert and update on each control-plane table with a pipeline identity; each must be refused,
    and the same change through the declared operation must succeed.
  evidence: Grants that allow only the declared operations, and a test run showing a direct write refused.
  cites:
  - standard: DAMA-DMBOK
    ref: Metadata Management, chapter 12
  related:
  - CFG-03
  - OPS-03
  review_check: null
  origin: deck
  enforced_by:
    shift_left: []
    proposed:
    - SL-META-05
    runtime: true
    review: null
    gap: null
- id: CFG-05
  status: draft
  since: 0.1.0
  title: An unknown or misplaced setting is rejected, never ignored
  concern: X1
  level: MUST
  core: true
  dimension: null
  stages:
  - platform
  statement: Every configuration key MUST be in a registry that names the level it may be set at and its allowed
    values; a key that is unknown, set at the wrong level or out of range MUST be rejected before deploy.
  failure_mode: A dataset set "quarantine_treshold" with a typo; the key was ignored, the default of zero applied,
    and every batch with one bad row was blocked for a week before anyone looked.
  test: Validate a manifest with a misspelt key, a key at the wrong level and a value outside its list; each must
    fail validation with the key named.
  evidence: The settings registry, and the validator's run in the pipeline that blocks the merge.
  cites:
  - standard: DAMA-DMBOK
    ref: Metadata Management, chapter 12
  related:
  - CFG-01
  - CFG-03
  - REL-04
  review_check: null
  origin: deck
  enforced_by:
    shift_left: []
    proposed:
    - SL-META-02
    runtime: true
    review: null
    gap: null
- id: ENG-01
  status: draft
  since: 0.1.0
  title: Platform tables are written only by the shared engines
  concern: X1
  level: MUST
  core: false
  dimension: null
  stages:
  - bronze
  - silver
  - gold
  statement: Every write to a bronze, silver or gold table MUST be made by the shared engine for that layer, driven
    by the dataset's declared metadata; code written for one dataset MUST NOT write a platform table itself.
  failure_mode: Fifty hand-written silver pipelines each fixed duplicates in their own way; a fix to the time zone
    rule reached eleven of them, and the other thirty-nine kept the bug for a year.
  test: List every writer of each platform table from the run log and lineage; any writer that is not a shared engine
    is a finding.
  evidence: Lineage showing each platform table written only by its layer's engine, and the list of findings, empty.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Integration and Interoperability, chapter 8
  related:
  - CFG-01
  - FLOW-01
  review_check: null
  origin: deck
  enforced_by:
    shift_left: []
    proposed:
    - SL-LAYER-02
    runtime: true
    review: Review rejects code written for one dataset that writes a platform table.
    gap: null
- id: BLD-01
  status: draft
  since: 0.2.0
  title: "Per-table code holds only the business rule"
  concern: X1
  level: MUST
  core: true
  dimension: null
  stages:
  - gold
  statement: "Code written for one gold table MUST hold only its business rule; reading inputs, watermarks, windows, keys, completeness, checks, writing and logging MUST be done by the shared engine from declared metadata."
  failure_mode: "Each of thirty notebooks handled late data its own way; a fix for one was never made in the other twenty-nine."
  test: "Read every per-table build: none may read or write a table, move a watermark or look up a surrogate key itself."
  evidence: "One shared engine, metadata per table, per-table builds that take inputs and return rows, and a test that fails if a build does input or output."
  cites: []
  related:
  - ENG-01
  - PURE-01
  enforced_by:
    shift_left: []
    proposed: []
    runtime: false
    review: "Code review: a per-table build that reads or writes a table, moves a watermark or looks up a key is rejected."
    gap: "No build-time check yet: a static check that a build function does no input or output is proposed."
- id: ENG-02
  status: draft
  since: 0.2.0
  title: "Every bronze-to-silver engine runs the same stages and passes the same proof"
  concern: X1
  level: MUST
  core: true
  dimension: consistency
  stages:
  - silver
  statement: "When more than one engine can build silver, each engine MUST call the same stage functions from the same metadata, MUST write the same tables and run log, MUST pass the same contract tests and the full simulated world against the oracle, and MUST refuse a dataset whose settings it cannot honour."
  failure_mode: "A second engine was added with its own copy of the cleaning rules; a fix to one was never made in the other, and two datasets disagreed on what a valid date was."
  test: "Run every dataset of the simulated world on each engine; silver must equal the oracle on both, and a dataset asking one engine for a feature it lacks must be refused at load."
  evidence: "One stage package, an engine setting per dataset, one contract test table for the stage runner, and world runs per engine in continuous integration."
  cites: []
  related:
  - ENG-01
  - PURE-01
  - BLD-01
  enforced_by:
    shift_left: []
    proposed: []
    runtime: true
    review: "Design review of any new engine: it must call the shared stage functions, not copies."
    gap: "No build-time check yet: the second engine and its contract table are being built (ADR-035)."
