# DAC obligations for X11, Security and access. Normative: edit here.
- id: ENC-01
  status: draft
  since: 0.1.0
  title: Data at rest is encrypted with separate keys and never public
  concern: X11
  level: MUST
  core: true
  dimension: null
  stages:
  - platform
  statement: Every store of platform data MUST be encrypted with a key separate for each environment and layer,
    MUST NOT be reachable from a public network, and raw landing copies MUST expire after a declared time.
  failure_mode: One shared key protected every bucket; a role granted for a test copy could decrypt production,
    and raw source files from two years earlier were still sitting in landing.
  test: Inspect the infrastructure definition and the deployed stores; any store without its own key, reachable
    publicly or without an expiry on landing is a finding.
  evidence: The infrastructure definition, and a scan of deployed stores with no findings.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Security, chapter 7
  related:
  - ENV-01
  - SEC-02
  review_check: null
  origin: deck
  enforced_by:
    shift_left: []
    proposed:
    - SL-SEC-11
    runtime: true
    review: null
    gap: null
- id: ENV-02
  status: draft
  since: 0.1.0
  title: Access through groups and service identities
  concern: X11
  level: MUST
  core: false
  dimension: null
  stages:
  - platform
  statement: Production jobs MUST run as service identities, and access MUST be granted to groups, never to named
    people.
  failure_mode: Production jobs ran under the lead developer's own account; when she left the company her account
    was disabled and every nightly job failed.
  test: List who owns and runs each production job; any job owned or run by a named person is a gap.
  evidence: A role-to-group access model, service identities for jobs in each environment, no direct user grants
    in production, and who approves access requests.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Security, chapter 7
  review_check: ENV-02
  related:
  - ENV-01
  - SEC-02
  - REL-05
  enforced_by:
    shift_left:
    - SL-SEC-08
    proposed: []
    runtime: true
    review: null
    gap: null
- id: REL-05
  status: draft
  since: 0.1.0
  title: No secrets in the repository
  concern: X11
  level: MUST
  core: true
  dimension: null
  stages:
  - platform
  statement: A secret MUST NOT be stored in the repository or anywhere in its history.
  failure_mode: A database password was committed in a script; the repository was later shared with a vendor, and
    the security team had to rotate credentials across four systems.
  test: Run a secret scanner over the whole repository history today.
  evidence: A named secret store per environment, code that reads secrets by name, and an automated secret scan
    on the repository.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Security, chapter 7
  review_check: REL-05
  related:
  - REL-04
  - ENV-02
  enforced_by:
