# DAC obligations for X17, Testing. Normative: edit here.
- id: PURE-01
  status: draft
  since: 0.1.0
  title: Transform logic is separate from reads and writes
  concern: X17
  level: MUST
  core: false
  dimension: null
  stages:
  - silver
  - gold
  statement: Every transform MUST be callable on in-memory inputs and return its output, with table reads and writes
    only at the edges of the engine that runs it, so it can be tested without a running platform.
  failure_mode: A fact read four tables, transformed them and wrote the result in one notebook; it could only be
    run against production, so it was never tested, and a join change broke margin for a month.
  test: Call each transform with small in-memory inputs in a unit test with no platform connection; it must run
    and return its output.
  evidence: The purity report per module, and unit tests that run without a platform.
  cites: []
  related:
  - TEST-03
  review_check: null
  origin: deck
  enforced_by:
    shift_left: []
    proposed: []
    runtime: true
    review: null
    gap: 'No build-time check yet: found only by the runtime test.'
- id: TEST-03
  status: draft
  since: 0.1.0
  title: Automated tests run on every change
  concern: X17
  level: MUST
  core: false
  dimension: null
  stages:
  - platform
  statement: Automated tests, including data tests, MUST run on every change and block the merge when they fail.
  failure_mode: A small refactor changed a join; the tests existed but were run by hand and nobody ran them, so
    the regression reached production.
  test: Break one business rule deliberately on a branch; the pipeline must fail before merge.
  evidence: Tests wired into the pull request and deployment pipeline as required gates, with coverage of the transformations
    that carry business rules.
  cites:
  - standard: DAMA-DMBOK
    ref: Data Quality, chapter 13
