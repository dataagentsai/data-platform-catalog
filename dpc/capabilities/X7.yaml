# DPC capabilities for X7, Lineage. Normative: edit here.
- id: DPC-0018
  status: draft
  since: 0.1.0
  level: MUST
  title: Lineage emitted on every run
  concern: X7
  stages:
  - bronze
  - silver
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  - PA6
  - PA7
  - PA8
  - PA9
  - PA10
  core: true
  port: lineage_emitter
  requirement: Every run MUST emit a lineage event in the open lineage format naming what it read and wrote, and
    the recorded edges MUST be checked against the allowed one-way flow between layers.
  failure_mode: A source column was dropped and nobody could say which reports it fed.
  discharges:
  - LIN-01
  - FLOW-01
  realization_policy: adopt
  slice: 1
  see_also: []
- id: DPC-0055
  status: draft
  since: 0.2.0
  level: MUST
  title: Consumers read only the semantic layer or published products
  concern: X7
  stages:
  - experiences
  archetypes:
  - PA5
  - PA9
  core: true
  port: experience
  requirement: Dashboards and self-serve analytics MUST read only certified metrics or published products, and MUST
    show when their data was last complete.
  failure_mode: A dashboard read silver directly; when silver added history rows its totals doubled.
  discharges:
  - FLOW-01
  - SERV-02
  realization_policy: bind
  see_also: []
