# DPC capabilities for X19, Performance. Normative: edit here.
- id: DPC-0098
  status: draft
  since: 0.2.0
  level: SHOULD
  title: Table layout tuned automatically
  concern: X19
  stages:
  - bronze
  - silver
  - gold
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  core: true
  port: table_writer
  requirement: Tables SHOULD use clustering chosen automatically from their query pattern, and compaction and clean-up
    SHOULD be run by the platform's automatic maintenance, with scheduled maintenance only where automatic maintenance
    is off.
  failure_mode: Small files piled up in a streaming table; queries slowed to minutes and nobody owned the clean-up
    job.
  discharges:
  - PERF-05
  realization_policy: bind
  adr:
  - ADR-011
  see_also: []
- id: DPC-0099
  status: draft
  since: 0.2.0
  level: SHOULD
  title: Compute right-sized by rule
  concern: X19
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  core: false
  port: compute_pool
  requirement: Compute size SHOULD be set by declared rules from the job's measured use, reviewed against its cost
    history.
  failure_mode: Every job ran on the largest size because one job once needed it.
  discharges:
  - COST-04
  - PERF-05
  realization_policy: own
  see_also: []
- id: DPC-0112
  status: draft
  since: 0.2.0
  level: SHOULD
  title: "Aggregate register"
  concern: X19
  stages:
  - gold
  - semantic
  archetypes:
  - PA5
  - PA9
  - PA10
  core: false
  port: semantic_layer
  requirement: "The platform SHOULD keep a register of aggregate tables and stored query results with their question, grain, owner and last read, SHOULD refresh them only for changed windows, and SHOULD report unread ones for removal."
  failure_mode: "Summary tables built for a dashboard that was retired kept refreshing for a year."
  discharges:
  - AGG-01
  realization_policy: bind
  see_also: []
