# DPC capabilities for X14, Audit and run log. Normative: edit here.
- id: DPC-0021
  status: draft
  since: 0.1.0
  level: MUST
  title: A run record with its configuration
  concern: X14
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  - PA6
  - PA7
  - PA8
  - PA9
  - PA10
  core: true
  port: run_log
  requirement: Every run MUST open a run record carrying a fingerprint and snapshot of its merged configuration,
    and close it with inputs, outputs, counts and status.
  failure_mode: A rerun of last month gave different numbers, and nobody could tell what the configuration had been.
  discharges:
  - CFG-03
  - OPS-03
  realization_policy: own
  slice: 1
  see_also: []
- id: DPC-0022
  status: draft
  since: 0.1.0
  level: MUST
  title: Load metadata on every row
  concern: X14
  stages:
  - bronze
  - silver
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  core: true
  port: table_writer
  requirement: Every bronze and silver row MUST carry the run id, the delivery id and the load time that wrote it.
  failure_mode: Finding which file produced one wrong row took a day of searching logs.
  discharges:
  - OPS-03
  realization_policy: own
  slice: 1
  see_also: []
