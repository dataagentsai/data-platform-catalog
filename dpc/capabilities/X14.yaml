# DPC capabilities for X14, Audit and run log. Normative: edit here.
- id: DPC-0021
  status: draft
  since: 0.1.0
  level: MUST
  title: A run record with its configuration
  concern: X14
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  - PA6
  - PA7
  - PA8
  - PA9
  - PA10
  core: true
  port: run_log
  requirement: Every run MUST open a run record carrying a fingerprint and snapshot of its merged configuration,
    and close it with inputs, outputs, counts and status.
  failure_mode: A rerun of last month gave different numbers, and nobody could tell what the configuration had been.
  discharges:
  - CFG-03
  - OPS-03
  realization_policy: own
  slice: 1
  see_also: []
- id: DPC-0022
  status: draft
  since: 0.1.0
  level: MUST
  title: Load metadata on every row
  concern: X14
  stages:
  - bronze
  - silver
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  core: true
  port: table_writer
  requirement: Every bronze and silver row MUST carry the run id, the delivery id and the load time that wrote it.
  failure_mode: Finding which file produced one wrong row took a day of searching logs.
  discharges:
  - OPS-03
  realization_policy: own
  slice: 1
  see_also: []
- id: DPC-0078
  status: draft
  since: 0.2.0
  level: MUST
  title: Access and changes audited
  concern: X14
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  core: true
  port: audit_log
  requirement: Every read of restricted data, grant change, configuration change and deletion MUST be recorded with
    who, what and when, and kept for the declared period.
  failure_mode: A leak was found, but nobody could say who had read the table in the last month.
  discharges:
  - SEC-04
  realization_policy: bind
  see_also: []
- id: DPC-0108
  status: draft
  since: 0.2.0
  level: MUST
  title: "Restatement log"
  concern: X14
  stages:
  - gold
  - semantic
  archetypes:
  - PA5
  - PA9
  - PA10
  core: true
  port: run_log
  requirement: "The shared engine MUST record every published window whose numbers change, with old and new totals, the reason and the run, and the platform MUST show the records to the numbers' users."
  failure_mode: "A correction changed last quarter's totals and nobody could show an auditor what the report had said before."
  discharges:
  - RSTM-01
  realization_policy: own
  see_also: []
