# DPC capabilities for X15, Replay, backfill and idempotency. Normative: edit here.
- id: DPC-0023
  status: draft
  since: 0.1.0
  level: MUST
  title: Deliveries kept as received, with a manifest
  concern: X15
  stages:
  - landing
  archetypes:
  - PA1
  - PA2
  - PA3
  core: true
  port: landing_store
  requirement: Every delivery MUST land with a manifest (source, window, files, row count, checksum) and MUST NOT
    be changed afterwards, so a replay reads the same bytes.
  failure_mode: A replay of last Tuesday read a file that had since been overwritten, and gave different totals.
  discharges:
  - DUP-01
  - DUP-02
  - RAW-01
  realization_policy: own
  slice: 1
  see_also: []
- id: DPC-0024
  status: draft
  since: 0.1.0
  level: MUST
  title: Every write carries a batch key
  concern: X15
  stages:
  - bronze
  - silver
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  core: true
  port: table_writer
  requirement: Every write MUST carry the id of the delivery and window it came from, and writing a batch that was
    already written MUST change nothing.
  failure_mode: After an outage the source resent yesterday's file and revenue doubled on the dashboard.
  discharges:
  - DUP-01
  - DUP-02
  - ORCH-03
  - IDEMP-01
  design_decisions:
  - key: batch_key_source
    question: Where does the batch key come from?
    tension: A checksum of the file catches exact resends but not a resend with a new name; the source's own batch
      id catches renames but only if the source has one.
    resolution: Use the source's window plus a content checksum; record both in the run log.
  realization_policy: own
  slice: 1
  see_also: []
- id: DPC-0025
  status: draft
  since: 0.1.0
  level: MUST
  title: History ordered by the source's change sequence
  concern: X15
  stages:
  - silver
  archetypes:
  - PA1
  - PA2
  core: true
  port: table_writer
  requirement: Tables that keep history MUST order changes by the source's change sequence, not by arrival, and
    MUST end with one current row per key and no overlapping validity periods however often a batch is rerun.
  failure_mode: Two updates to one order arrived in the wrong order and the older status became current.
  discharges:
  - SCD-02
  design_decisions:
  - key: ordering_column
    question: What orders the changes when the source gives no sequence?
    tension: Arrival time is always there but wrong when deliveries overlap; a source timestamp can tie.
    resolution: Require a source sequence or timestamp in the contract; on a tie, use a declared tie-breaker column
      and record the tie.
  realization_policy: own
  slice: 1
  see_also: []
- id: DPC-0026
  status: draft
  since: 0.1.0
  level: MUST
  title: Late changes corrected in place
  concern: X15
  stages:
  - silver
  archetypes:
  - PA1
  - PA2
  core: true
  port: table_writer
  requirement: A change that arrives after later ones MUST be placed in history by its source sequence, and the
    validity periods around it MUST be corrected; the periods it affects MUST be marked for rebuild downstream.
  failure_mode: An address change arrived a week late and every order in between was shown at the old address.
  discharges:
  - LATE-01
  - SCD-02
  realization_policy: own
  slice: 1
  see_also: []
- id: DPC-0027
  status: draft
  since: 0.1.0
  level: MUST
  title: Watermarks kept in the metadata store
  concern: X15
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  core: true
  port: metadata_service
  requirement: A dataset's watermark MUST be kept in the metadata store, never in the mover, and MUST advance in
    the same transaction that closes the run record.
  failure_mode: The copy tool was replaced and its saved position went with it, so a month was loaded twice.
  discharges:
  - HIST-03
  - HIST-04
  realization_policy: own
  slice: 1
  see_also: []
- id: DPC-0028
  status: draft
  since: 0.1.0
  level: MUST
  title: Any past window can be reloaded by parameter
  concern: X15
  stages:
  - bronze
  - silver
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  core: true
  port: orchestrator
  requirement: The normal job MUST accept a window as a parameter and reload it, changing only that window's rows
    and the rows derived from them.
  failure_mode: Reloading one bad day meant a hand-written script that also wiped the day after.
  discharges:
  - HIST-04
  realization_policy: own
  slice: 1
  see_also: []
- id: DPC-0079
  status: draft
  since: 0.2.0
  level: MUST
  title: Gold windows replaced, never appended
  concern: X15
  stages:
  - gold
  archetypes:
  - PA5
  core: true
  port: model_runner
  requirement: A modelled fact MUST be written by replacing whole windows (or merging on the grain key) by its one
    writer; it MUST NOT be appended to, and MUST be a table built by window recompute unless it is a simple single-input
    aggregate.
  failure_mode: A rerun appended a day again; the month's sales were up by a day's worth and looked like growth.
  discharges:
  - DUP-02
  - LATE-01
  - HIST-04
  - GOLD-01
  - IDEMP-01
  realization_policy: own
  adr:
  - ADR-006
  see_also: []
- id: DPC-0080
  status: draft
  since: 0.2.0
  level: MUST
  title: Changed windows read in full
  concern: X15
  stages:
  - gold
  archetypes:
  - PA5
  core: true
  port: model_runner
  requirement: The harness MUST find the windows changed in any input since its bookmark and MUST read every input
    in full for those windows before building them.
  failure_mode: Orders landed on Monday and deliveries on Wednesday; joining only the new rows missed every match
    across the two days.
  discharges:
  - LATE-01
  realization_policy: own
  adr:
  - ADR-003
  see_also: []
- id: DPC-0081
  status: draft
  since: 0.2.0
  level: MUST
  title: Deterministic surrogate keys with reserved members
  concern: X15
  stages:
  - gold
  archetypes:
  - PA5
  core: true
  port: model_runner
  requirement: Surrogate keys MUST be a deterministic hash of the source and business key (plus the version start
    for history dimensions), every dimension MUST hold the reserved members unknown and not applicable, and business
    keys MUST be kept beside surrogate keys in facts.
  failure_mode: A dimension rebuilt with sequence keys renumbered every member; every fact pointed at the wrong
    customer.
  discharges:
  - DUP-02
  - DES-04
  - KEY-01
  realization_policy: own
  adr:
  - ADR-004
  see_also: []
- id: DPC-0082
  status: draft
  since: 0.2.0
  level: MUST
  title: Corrections applied through a backfill plan
  concern: X15
  stages:
  - silver
  - gold
  archetypes:
  - PA5
  - PA10
  core: true
  port: model_runner
  requirement: Corrections MUST be rows in a corrections table (entity, field, value, applies from and to, who,
    why, status), MUST reach gold only through the window recompute, and only when a backfill plan activates them
    and names the windows to rebuild.
  failure_mode: A hand fix in gold was overwritten by the next rebuild, and nobody could explain the number in between.
  discharges:
  - HIST-04
  - LATE-01
  - HIST-05
  realization_policy: own
  adr:
  - ADR-017
  see_also: []
- id: DPC-0083
  status: draft
  since: 0.2.0
  level: MUST
  title: One harness for every modelled fact
  concern: X15
  stages:
  - gold
  archetypes:
  - PA5
  core: true
  port: model_runner
  requirement: Each modelled fact MUST supply exactly one declared, pure build() (a set-based query model or a pure
    dataframe function) and the harness MUST own all reading, key lookup, checks and writing.
  failure_mode: Every fact was its own notebook with reads and writes mixed in; none could be unit-tested.
  discharges:
  - DUP-02
  - LATE-01
  - DES-04
  - PURE-01
  realization_policy: own
  adr:
  - ADR-003
  - ADR-013
  see_also: []
- id: DPC-0085
  status: draft
  since: 0.2.0
  level: MUST
  title: History kind follows the dataset kind
  concern: X15
  stages:
  - silver
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  core: true
  port: table_writer
  requirement: Each dataset MUST declare its kind (master, transaction, event, snapshot), which MUST set its history
    (type 2, type 1, append, snapshot) unless overridden; only listed columns MAY open a new version; deletes MUST
    be soft.
  failure_mode: A last-updated stamp opened a new version every night and the material table grew a hundred-fold.
  discharges:
  - SCD-02
  - DES-04
  realization_policy: own
  adr:
  - ADR-016
  see_also: []
- id: DPC-0086
  status: draft
  since: 0.2.0
  level: MUST
  title: Stream replays dropped by event id
  concern: X15
  stages:
  - bronze
  - silver
  archetypes:
  - PA4
  core: false
  port: stream_bus
  requirement: Stream readers MUST drop an event already seen, by its event id, within the declared replay window.
  failure_mode: After a restart the stream replayed an hour and the press produced twice as many tyres that hour.
  discharges:
  - DUP-04
  realization_policy: bind
  see_also: []
- id: DPC-0087
  status: draft
  since: 0.2.0
  level: MUST
  title: Feeds idempotent and from published products
  concern: X15
  stages:
  - experiences
  archetypes:
  - PA8
  core: false
  port: feed_writer
  requirement: Feeds MUST read only published products, and sending a window twice MUST leave the target unchanged.
  failure_mode: A partner feed was resent after a timeout and the partner booked the same orders twice.
  discharges:
  - DUP-02
  - FLOW-01
  realization_policy: own
  see_also: []
