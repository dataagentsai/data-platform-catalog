# DPC capabilities for X1, Metadata and control plane. Normative: edit here.
- id: DPC-0001
  status: draft
  since: 0.1.0
  level: MUST
  title: Every dataset is declared in a manifest
  concern: X1
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  - PA6
  - PA7
  - PA8
  - PA9
  - PA10
  core: true
  port: metadata_service
  requirement: Every source and dataset MUST be declared in a manifest file in version control, validated against
    a key registry before it is loaded; anything deployed without a manifest entry MUST be reported.
  failure_mode: A hand-made table fed the finance report for a year, and nobody knew it existed until its owner
    left.
  discharges:
  - CFG-01
  - REL-01
  design_decisions:
  - key: authoring_format
    question: Is the manifest authored as files or edited in the database?
    tension: Files can be reviewed and replayed but need a loader; editing the database is quick and leaves no history.
    resolution: Files in version control are the only way in; a validating loader writes the database, and pipelines
      read only the database (agreed 27 Oct).
  realization_policy: own
  slice: 1
  see_also: []
- id: DPC-0002
  status: draft
  since: 0.1.0
  level: MUST
  title: One merged view of configuration per dataset
  concern: X1
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  - PA6
  - PA7
  - PA8
  - PA9
  - PA10
  core: true
  port: metadata_service
  requirement: Pipelines MUST read configuration only through one merged view per dataset (platform, then source,
    then dataset, the later one winning), never from code or from their own files.
  failure_mode: A connection string in a notebook pointed test at production for a week.
  discharges:
  - REL-04
  design_decisions:
  - key: merge_order
    question: When the platform, the source and the dataset set the same key, which wins?
    tension: A broad default is safe to set once; a narrow setting knows the data. Either can surprise someone.
    resolution: The narrowest wins (dataset over source over platform), and the merged view records where each value
      came from.
  realization_policy: own
  slice: 1
  see_also: []
- id: DPC-0003
  status: draft
  since: 0.1.0
  level: MUST
  title: Concerns on by default, off only by waiver
  concern: X1
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  - PA6
  - PA7
  - PA8
  - PA9
  - PA10
  core: true
  port: metadata_service
  requirement: Quality rules, reconciliation, lineage, freshness and cost tags MUST be on for every dataset unless
    a waiver with a reason, an approver and an expiry date turns one off; expired waivers MUST fail validation.
  failure_mode: A new table went live with no quality rules because the template made them optional.
  discharges:
  - CFG-02
  realization_policy: own
  slice: 1
  see_also: []
- id: DPC-0033
  status: draft
  since: 0.2.0
  level: MUST
  title: The metadata store is reached only through its procedures
  concern: X1
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  core: true
  port: metadata_service
  requirement: Services MUST read and write the metadata store only through its published procedures and reader
    views; no service MAY query or write its tables directly.
  failure_mode: A job wrote a watermark straight into a table, skipped the run record, and the replay next week
    started from the wrong place.
  discharges:
  - CFG-01
  - REL-01
  - CFG-04
  design_decisions:
  - key: store_kind
    question: Files only, or files compiled into a relational store?
    tension: Files are easy to review; jobs need transactions, joins and one place to record run state.
    resolution: Files in version control are the authoring format; a loader writes them into a relational store
      whose procedures are the only way in (ADR-010).
  realization_policy: own
  adr:
  - ADR-010
  see_also: []
- id: DPC-0034
  status: draft
  since: 0.2.0
  level: MUST
  title: Every setting registered with its default
  concern: X1
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  core: true
  port: metadata_service
  requirement: Every configuration key MUST be registered with its type, default and the component that reads it,
    and a manifest using an unregistered key MUST be rejected.
  failure_mode: A misspelt freshness key was ignored for months and the dataset ran with the default of no target.
  discharges:
  - CFG-02
  - REL-04
  - CFG-05
  realization_policy: own
  see_also:
  - DPC-0002
- id: DPC-0035
  status: draft
  since: 0.2.0
  level: MUST
  title: Jobs and pipelines generated from the manifest
  concern: X1
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  core: true
  port: null
  requirement: Jobs, pipelines, mover settings and their schedules MUST be generated from the manifest; adding a
    dataset MUST change only manifest files, and generated files MUST NOT be edited by hand.
  failure_mode: Three hundred hand-built jobs drifted apart; nobody could say which ones still had the retry fix.
  discharges:
  - CFG-01
  - REL-01
  realization_policy: own
  adr:
  - ADR-019
  see_also: []
- id: DPC-0084
  status: draft
  since: 0.2.0
  level: MUST
  title: One common pipeline for one-to-one gold tables
  concern: X1
  stages:
  - gold
  archetypes:
  - PA5
  core: true
  port: model_runner
  requirement: Gold tables that are one silver table reshaped (renamed, keyed, history kept) MUST be built by one
    common pipeline driven only by metadata, with no per-table code.
  failure_mode: Two hundred copied dimension pipelines each fixed the same bug differently.
  discharges:
  - CFG-01
  - DES-04
  - ENG-01
  realization_policy: own
  adr:
  - ADR-003
  see_also: []
