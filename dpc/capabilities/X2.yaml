# DPC capabilities for X2, Orchestration. Normative: edit here.
- id: DPC-0004
  status: draft
  since: 0.1.0
  level: MUST
  title: Jobs start on complete deliveries
  concern: X2
  stages:
  - landing
  - bronze
  - silver
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  core: true
  port: orchestrator
  requirement: A load MUST start only when its delivery manifest exists, and a downstream job MUST start only when
    its inputs for the window are complete.
  failure_mode: A job started at two in the morning on a half-copied file and published half a day as a whole one.
  discharges:
  - ORCH-01
  realization_policy: bind
  slice: 1
  see_also: []
- id: DPC-0005
  status: draft
  since: 0.1.0
  level: MUST
  title: Retries only for declared passing failures
  concern: X2
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  - PA6
  - PA7
  - PA8
  - PA9
  - PA10
  core: false
  port: orchestrator
  requirement: The retry policy MUST list which failures are passing (timeouts, throttling); every other failure
    MUST stop the run and alert without retrying.
  failure_mode: A data error was retried forty times overnight and the alert arrived after the morning report.
  discharges:
  - ORCH-02
  realization_policy: bind
  slice: 1
  see_also: []
- id: DPC-0006
  status: draft
  since: 0.1.0
  level: MUST
  title: One writer per table at a time
  concern: X2
  stages:
  - bronze
  - silver
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  - PA6
  - PA7
  - PA8
  - PA9
  - PA10
  core: true
  port: orchestrator
  requirement: A table MUST have at most one run writing to it at a time; a second run MUST wait or fail with a
    clear message.
  failure_mode: A manual rerun overlapped the scheduled run and the day's totals were counted one and a half times.
  discharges:
  - ORCH-04
  realization_policy: own
  slice: 1
  see_also: []
