# DPC capabilities for X17, Testing. Normative: edit here.
- id: DPC-0031
  status: draft
  since: 0.1.0
  level: MUST
  title: Every claimed failure has a test that causes it
  concern: X17
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  - PA6
  - PA7
  - PA8
  - PA9
  - PA10
  core: true
  port: null
  requirement: Every incident kind the platform claims to handle MUST have a test that plants it on purpose and
    checks the expected detector fires.
  failure_mode: The late-data detector had never fired in two years; when it mattered, it was misconfigured.
  discharges:
  - TEST-05
  - SIM-01
  realization_policy: own
  slice: 1
  see_also: []
- id: DPC-0091
  status: draft
  since: 0.2.0
  level: MUST
  title: Checks before commit and in every pipeline run
  concern: X17
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  core: true
  port: null
  requirement: The engineering checks MUST run before commit, on every pull request and before deploy, and a failed
    check MUST stop the change.
  failure_mode: A full-table read without a filter reached production; the check that would have caught it ran only
    by hand.
  discharges:
  - TEST-03
  - REL-02
  realization_policy: adopt
  see_also: []
- id: DPC-0092
  status: draft
  since: 0.2.0
  level: MUST
  title: Pure stages tested by table-driven unit tests
  concern: X17
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  core: true
  port: null
  requirement: Every stage and every build() MUST be a pure function with IO only at the edges, and MUST have table-driven
    unit tests for its standard cases (late dimension, mid-window change, duplicate input, same window twice).
  failure_mode: The only test of a fact was the whole pipeline on a full copy; it took an hour and nobody ran it.
  discharges:
  - TEST-03
  - PURE-01
  realization_policy: own
  adr:
  - ADR-013
  see_also: []
- id: DPC-0093
  status: draft
  since: 0.2.0
  level: MUST
  title: Contract tests for every port
  concern: X17
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  core: true
  port: null
  requirement: Every adapter MUST pass its port's contract-test table, derived from the port's invariants, before
    it is bound.
  failure_mode: A new storage adapter wrote non-atomically; it passed its own tests and corrupted a day on the first
    retry.
  discharges:
  - TEST-03
  - TEST-05
  realization_policy: own
  adr:
  - ADR-020
  see_also: []
- id: DPC-0094
  status: draft
  since: 0.2.0
  level: MUST
  title: A release gate compares old and new on cloned tables
  concern: X17
  stages:
  - platform
  archetypes:
  - PA5
  - PA10
  core: true
  port: deployer
  requirement: Before release, the new build MUST run beside the old on cloned tables, and declared totals MUST
    match within tolerance or the release MUST stop.
  failure_mode: A refactor changed a rounding rule; a quarter's revenue moved by a fraction and nobody saw why.
  discharges:
  - REL-03
  - REL-07
  realization_policy: bind
  see_also: []
