# DPC capabilities for X18, Resilience and recovery. Normative: edit here.
- id: DPC-0095
  status: draft
  since: 0.2.0
  level: MUST
  title: Recovery targets declared and drilled
  concern: X18
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  core: true
  port: object_store
  requirement: Recovery time and data-loss limits MUST be declared per data product tier, storage and the metadata
    store MUST be copied to meet them, and recovery MUST be drilled on a schedule.
  failure_mode: The backup existed; restoring it had never been tried and took four days.
  discharges:
  - ORCH-05
  realization_policy: bind
  see_also: []
- id: DPC-0096
  status: draft
  since: 0.2.0
  level: MUST
  title: Streams restart from their checkpoint
  concern: X18
  stages:
  - bronze
  - silver
  archetypes:
  - PA4
  core: false
  port: stream_bus
  requirement: A stream reader MUST restart from its stored checkpoint, and the bus MUST keep events longer than
    the longest outage promised.
  failure_mode: A reader restarted from the newest event after an outage; two hours of readings were never loaded.
  discharges:
  - ORCH-06
  realization_policy: bind
  see_also: []
- id: DPC-0097
  status: draft
  since: 0.2.0
  level: MUST
  title: A rollback includes the tables a release changed
  concern: X18
  stages:
  - platform
  archetypes:
  - PA5
  core: true
  port: deployer
  requirement: Rolling back a release MUST return the tables it changed to their earlier versions, not only the
    code.
  failure_mode: The code was rolled back; the table it had rewritten stayed wrong.
  discharges:
  - REL-07
  realization_policy: bind
  see_also: []
- id: DPC-0116
  status: draft
  since: 0.2.0
  level: MUST
  title: "Housekeeping job for bronze, archive and table upkeep"
  concern: X18
  stages:
  - bronze
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  core: true
  port: table_writer
  requirement: "The platform MUST run housekeeping as its own scheduled job, separate from loads: per dataset it takes the table's writer lock, writes and checks a baseline batch when no recent full copy exists, archives and then removes batches older than both the baseline and the correction window, expires old snapshots and compacts files, and logs every removal."
  failure_mode: "Clean-up ran inside the nightly load, overlapped the lander on the same table, and removed a batch the lander was still writing."
  discharges:
  - RET-01
  realization_policy: own
  see_also: []
