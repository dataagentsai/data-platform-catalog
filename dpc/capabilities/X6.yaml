# DPC capabilities for X6, Reconciliation. Normative: edit here.
- id: DPC-0015
  status: draft
  since: 0.1.0
  level: MUST
  title: Counts and totals compared at every hop
  concern: X6
  stages:
  - sources
  - bronze
  - silver
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  core: true
  port: reconciler
  requirement: Every run MUST record row counts and declared control totals at source, bronze and silver, compare
    each hop with the one before, and name the first hop where a difference appears.
  failure_mode: Silver was two percent short of the source and it took three days to find the filter that caused
    it.
  discharges:
  - REC-01
  - REC-05
  realization_policy: own
  slice: 1
  see_also: []
- id: DPC-0016
  status: draft
  since: 0.1.0
  level: MUST
  title: Tolerances and sign-off declared
  concern: X6
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  core: true
  port: reconciler
  requirement: Every reconciliation MUST have a declared tolerance and a named person who signs off differences
    inside it.
  failure_mode: Every small difference became an incident until people stopped reading the alerts.
  discharges:
  - REC-03
  realization_policy: own
  slice: 1
  see_also: []
- id: DPC-0017
  status: draft
  since: 0.1.0
  level: MUST
  title: Source deletes detected and applied by rule
  concern: X6
  stages:
  - bronze
  - silver
  archetypes:
  - PA1
  - PA2
  core: true
  port: table_writer
  requirement: Rows deleted at the source MUST be detected, from the change feed where there is one and by comparing
    full key lists where there is not, and applied in silver by the dataset's declared delete rule (mark as deleted
    or remove).
  failure_mode: Cancelled orders were deleted at the source but stayed in the warehouse, and revenue was overstated
    for a quarter.
  discharges:
  - DEL-01
  design_decisions:
  - key: delete_detection
    question: How are deletes found when the source has no change feed?
    tension: Comparing full key lists finds every delete but costs a full read; trusting a delete flag is cheap
      but only works if the source sets it.
    resolution: Use the change feed when there is one; otherwise compare key lists on a declared schedule, and record
      which method a dataset uses.
  realization_policy: own
  slice: 1
  see_also: []
- id: DPC-0052
  status: draft
  since: 0.2.0
  level: MUST
  title: Live source compared with silver by buckets
  concern: X6
  stages:
  - sources
  - silver
  archetypes:
  - PA2
  - PA3
  core: true
  port: reconciler
  requirement: Each dataset MUST declare a reconciliation entry (keys, measures, window, buckets, tolerance, schedule),
    the live source MUST be compared with silver up to the watermark by counts, totals and hash buckets, and row-level
    differences MUST be computed only inside a bucket that does not match.
  failure_mode: The change feed dropped rows during a source upgrade; batch-by-batch counts agreed, the source and
    silver did not.
  discharges:
  - REC-01
  - REC-05
  realization_policy: own
  see_also: []
- id: DPC-0053
  status: draft
  since: 0.2.0
  level: MUST
  title: Deletes flow through to gold and indexes
  concern: X6
  stages:
  - silver
  - gold
  - semantic
  archetypes:
  - PA5
  - PA7
  core: true
  port: model_runner
  requirement: A row soft-deleted in silver MUST stop counting in every gold window and metric that used it, and
    in every index built from it, within the declared time.
  failure_mode: A cancelled order line was gone from silver but still counted in monthly sales.
  discharges:
  - DEL-03
  realization_policy: own
  adr:
  - ADR-016
  see_also: []
- id: DPC-0054
  status: draft
  since: 0.2.0
  level: MUST
  title: Mass deletes stopped before bronze
  concern: X6
  stages:
  - landing
  - bronze
  archetypes:
  - PA1
  - PA2
  - PA3
  core: true
  port: null
  requirement: For a full copy, the lander MUST compare its keys with silver's current keys before appending, and
    if more than the dataset's declared share would be deleted, MUST append nothing, hold the files and block the
    dataset with an alert.
  failure_mode: A pull came back with a third of the materials missing; silver deleted them and every dashboard
    lost a third of its products.
  discharges:
  - DEL-01
  - DQ-04
  - DEL-04
  realization_policy: own
  adr:
  - ADR-016
  see_also: []
