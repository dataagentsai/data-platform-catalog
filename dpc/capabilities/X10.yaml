# DPC capabilities for X10, Cost and FinOps. Normative: edit here.
- id: DPC-0062
  status: draft
  since: 0.2.0
  level: MUST
  title: Cost split per data product
  concern: X10
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  core: true
  port: cost_ledger
  requirement: Spend MUST be attributed to team, data product, dataset and job, splitting shared runs by declared
    shares (task time or rows written), and untagged spend MUST be reported.
  failure_mode: The platform bill tripled and nobody could say which data product had caused it.
  discharges:
  - COST-03
  realization_policy: own
  see_also: []
- id: DPC-0063
  status: draft
  since: 0.2.0
  level: MUST
  title: Budgets with alerts per data product
  concern: X10
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  core: true
  port: cost_ledger
  requirement: Each data product MUST have a budget, and spend over budget MUST alert its owner.
  failure_mode: A backfill ran in a loop over a weekend and spent a month's budget.
  discharges:
  - COST-02
  realization_policy: bind
  see_also: []
- id: DPC-0064
  status: draft
  since: 0.2.0
  level: SHOULD
  title: Waste and cost anomalies found by rule
  concern: X10
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  core: false
  port: cost_ledger
  requirement: Cost records SHOULD be scanned by rules for waste (idle compute, oversized pools, full reloads that
    could be incremental) and for anomalies against each job's own history.
  failure_mode: A job that used to cost a few dollars a day doubled each week; nobody looked until the invoice.
  discharges:
  - COST-04
  - COST-02
  realization_policy: own
  see_also: []
- id: DPC-0065
  status: draft
  since: 0.2.0
  level: MUST
  title: Compute stops when idle
  concern: X10
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  core: true
  port: compute_pool
  requirement: Compute MUST stop within a declared idle limit, and every pool MUST carry the team, dataset and job
    tags.
  failure_mode: A development cluster ran every night and weekend for a quarter.
  discharges:
  - COST-04
  - COST-03
  realization_policy: bind
  see_also: []
