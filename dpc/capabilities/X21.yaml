# DPC capabilities for X21, Agent assistance. Normative: edit here.
- id: DPC-0101
  status: draft
  since: 0.2.0
  level: MUST
  title: Agents read evidence and propose manifest changes only
  concern: X21
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  core: false
  port: agent_runtime
  requirement: Platform agents MUST be enabled per environment in the manifest, MUST read the run log and evidence
    through declared tools, and MUST propose changes only as manifest pull requests.
  failure_mode: A helper agent edited a production job directly; the next generated deploy silently reverted it.
  discharges:
  - GATE-03
  realization_policy: own
  adr:
  - ADR-023
  see_also: []
- id: DPC-0102
  status: draft
  since: 0.2.0
  level: MUST
  title: Agents evaluated and guarded before they are enabled
  concern: X21
  stages:
  - platform
  archetypes:
  - PA1
  - PA2
  - PA3
  - PA4
  - PA5
  core: false
  port: agent_runtime
  requirement: An agent MUST pass its evaluation set and run behind its guard rules before it is enabled in an environment.
  failure_mode: A triage agent closed real incidents as noise for a week before anyone noticed.
  discharges:
  - GATE-03
  - TEST-03
  realization_policy: adopt
  adr:
  - ADR-023
  see_also: []
