# DPC ports: the seams every product sits behind (rule R4, code to interface). Normative: edit here.
# Record shape copied from the AI Harness Catalog's ports/*.yaml. See dpc/README.md.
#   service: A acquire (sources to silver) | B model (silver to semantic) | C serve (experiences) | platform
#   tier: core (needed by slice 1 or every platform) | later
#   kernel_owns: what our own code decides, whatever product sits behind the port
#   supplied_outside: what the adapter brings
#   invariants[].obligation: the DAC obligation the invariant protects
#   binds_in: which binding layer may fill the port (decision M1, ADR-014): engine, cloud or both. Checked by the linter.

# ---------- Service A: acquire ----------
- port: mover
  status: draft
  since: 0.1.0
  service: A
  tier: core
  binds_in: [cloud, engine]
  concerns: [X15, X8]
  stages: [sources, landing]
  summary: >-
    Copies bytes from a source into landing as files plus a small delivery manifest. It can be any tool
    (decision D11); it holds no business logic and no state the platform depends on.
  kernel_owns: >-
    The delivery manifest shape (source, window, file list, row count, checksum), the watermark, and the rule
    that a delivery is complete only when its manifest is written.
  supplied_outside: Reaching the source (network, credentials, connectors), paging, throttling and the copy itself.
  operations:
    - {name: deliver, intent: Copy one declared window of one source into landing and write its delivery manifest.}
    - {name: describe, intent: Report which load patterns this mover supports (full, watermark, log-based change, files, pages)., optional: true}
  invariants:
    - must: Watermarks and run state live in the metadata service, never inside the mover.
      because: State kept inside a tool is lost when a source moves to another mover.
      obligation: HIST-04
      checkable: static
    - must: A delivery without a manifest is not picked up.
      because: A half-copied folder would otherwise load as a complete day.
      obligation: ORCH-01
      checkable: dynamic

- port: landing_store
  status: draft
  since: 0.1.0
  service: A
  tier: core
  binds_in: [cloud, engine]
  concerns: [X18, X14]
  stages: [landing]
  summary: Keeps every delivery exactly as received, so a bad parse can be redone from the original bytes.
  kernel_owns: The folder layout by source, delivery and date; retention; the rule that landing is written once and never edited.
  supplied_outside: The storage itself.
  operations:
    - {name: put, intent: Store a delivery's files and manifest under its delivery id.}
    - {name: list, intent: List deliveries not yet landed, oldest first.}
    - {name: read, intent: Read one delivery's files by id.}
  invariants:
    - must: A delivery is immutable once its manifest exists.
      because: Replaying a day must read the same bytes as the first run.
      obligation: DUP-02
      checkable: dynamic

- port: table_writer
  status: draft
  since: 0.1.0
  service: A
  tier: core
  binds_in: [engine]
  concerns: [X15, X3]
  stages: [bronze, silver, gold]
  summary: Writes rows into a table by a declared pattern (append, overwrite a window, upsert, history type 1 or 2).
  kernel_owns: >-
    Which pattern a dataset uses (from the manifest), the business key, the batch key that makes a rerun change
    nothing, and the load metadata columns on every row.
  supplied_outside: The table format, its transactions, and how a merge or overwrite is executed.
  operations:
    - {name: write, intent: Write a batch to a table by the dataset's declared pattern and batch key, in one transaction.}
    - {name: fingerprint, intent: Return row count and key totals for a table or a window of it.}
    - {name: restore, intent: Return a table to an earlier version., optional: true}
  invariants:
    - must: Writing the same batch twice leaves the table unchanged.
      because: Sources resend files and jobs get rerun; neither may double a number.
      obligation: DUP-01
      checkable: dynamic
    - must: A write either completes or leaves no trace.
      because: A job killed half-way must not leave half a day behind.
      obligation: ORCH-03
      checkable: dynamic
    - must: History tables end with one current row per key whatever the arrival order.
      because: Out-of-order changes are normal in change capture.
      obligation: SCD-02
      checkable: dynamic

- port: contract_enforcer
  status: draft
  since: 0.1.0
  service: A
  tier: core
  binds_in: [engine]
  concerns: [X3, X4]
  stages: [bronze, silver]
  summary: Compares an incoming batch with the dataset's contract (columns, types, keys) before it reaches silver.
  kernel_owns: >-
    What counts as a breaking change (rename, removal, retype), what counts as additive (a new column), and the
    rule that the contract file is the only source of the expected shape.
  supplied_outside: Reading the contract format and comparing schemas.
  operations:
    - {name: check, intent: Compare a batch's schema with the contract and return pass, additive change or breaking change with the columns named.}
  invariants:
    - must: A breaking change stops the load and names the column.
      because: A renamed column loaded as nulls looks like a quiet business change for weeks.
      obligation: SCH-02
      checkable: dynamic
    - must: The enforcer never edits the contract.
      because: A contract loosened to make a job pass hides the very change it exists to catch.
      obligation: GATE-02
      checkable: static

- port: quarantine
  status: draft
  since: 0.1.0
  service: A
  tier: core
  binds_in: [engine]
  concerns: [X4]
  stages: [bronze, silver]
  summary: Holds rows that failed a blocking rule or could not be parsed, with the reason, until they are fixed and replayed.
  kernel_owns: The reason codes (rule id or parse error), counts per run, and the replay path back into silver.
  supplied_outside: The storage.
  operations:
    - {name: hold, intent: Keep failed rows with the rule id, the reason and the run id.}
    - {name: count, intent: Count held rows by dataset, run and reason.}
    - {name: release, intent: Return fixed rows to the normal load path.}
  invariants:
    - must: Every row that leaves the load path is either in silver or in quarantine.
      because: A row that disappears silently breaks reconciliation and nobody can say why.
      obligation: DQ-02
      checkable: dynamic

# ---------- Service B: model ----------
- port: model_runner
  status: draft
  since: 0.1.0
  service: B
  tier: later
  binds_in: [engine]
  concerns: [X15, X17]
  stages: [gold]
  summary: >-
    The gold harness (ADR-003). One-to-one gold tables go through one common pipeline driven by metadata; each
    modelled fact supplies one pure build() (a set-based query model or a pure dataframe function) and the harness
    does everything else: detect changed windows, read them in full, look up keys as of the event, check, replace.
  kernel_owns: >-
    The model's grain and key, the window and look-back for late rows, surrogate keys and reserved members,
    corrections, completeness per window, and the tests that must pass before publish. All IO is here, never in build().
  supplied_outside: Running the query or dataframe engine and the transactional window replace.
  operations:
    - {name: build, intent: Build one model, or the windows of a model affected by changed inputs.}
    - {name: test, intent: Run a model's tests and return results with rows examined.}
    - {name: plan_backfill, intent: Rebuild a declared set of windows in chunks, for corrections and restatements., optional: true}
  invariants:
    - must: A late row rebuilds every period it affects and nothing else.
      because: Rebuilding everything costs money; rebuilding too little leaves wrong totals.
      obligation: LATE-01
      checkable: dynamic
    - must: A window is replaced whole, never appended to.
      because: Appending on a rerun or a backfill doubles the number.
      obligation: DUP-02
      checkable: dynamic
    - must: No fact row is dropped because its dimension has not arrived; it takes the unknown member.
      because: An inner join to a late dimension silently loses sales.
      obligation: LATE-02
      checkable: dynamic

- port: semantic_layer
  status: draft
  since: 0.1.0
  service: B
  tier: later
  binds_in: [engine]
  concerns: [X13]
  stages: [semantic]
  summary: Holds each metric's definition once, and answers every consumer from that definition.
  kernel_owns: The metric files and the rule that they are protected paths.
  supplied_outside: Query planning and caching.
  operations:
    - {name: define, intent: Publish a metric definition from its file.}
    - {name: query, intent: Answer a metric query for a consumer.}
  invariants:
    - must: No consumer computes a governed metric outside this port.
      because: Two formulas for revenue give two numbers in the same meeting.
      obligation: SERV-04
      checkable: static

- port: product_publisher
  status: draft
  since: 0.1.0
  service: B
  tier: later
  binds_in: [engine]
  concerns: [X3, X13]
  stages: [gold, semantic]
  summary: Publishes a gold dataset as a data product with its contract, owner and freshness promise.
  kernel_owns: The product description and its contract reference.
  supplied_outside: Where and how the product is listed and shared.
  operations:
    - {name: publish, intent: List a product with its contract and owner.}
    - {name: deprecate, intent: Mark a product or field as going away, with a date.}
  invariants:
    - must: Nothing is published without a contract.
      because: A consumer with no contract has nothing to hold the platform to.
      obligation: SERV-01
      checkable: static

# ---------- Service C: serve (later) ----------
- port: experience
  status: draft
  since: 0.1.0
  service: C
  tier: later
  binds_in: [engine]
  concerns: [X9, X11]
  stages: [experiences]
  summary: >-
    Dashboards and self-serve analytics. Split in 0.2.0 because the deck's Out Port needed it: conversation, data_api,
    event_publisher, feed_writer, vector_index, feature_store and model_server are their own ports.
  kernel_owns: The rule that experiences read only the semantic layer or published products, and show when data was last complete.
  supplied_outside: The surface itself.
  operations:
    - {name: read, intent: Read a metric or product on behalf of a consumer, with their identity.}
  invariants:
    - must: An experience shows the time its data was last complete.
      because: Stale data mistaken for current data drives wrong decisions.
      obligation: SERV-02
      checkable: dynamic
    - must: An experience reads only from the semantic layer or a published product.
      because: Reading silver directly breaks the one-way flow and the single metric definition.
      obligation: FLOW-01
      checkable: static

# ---------- Platform: cross-cutting ----------
- port: metadata_service
  status: draft
  since: 0.1.0
  service: platform
  tier: core
  binds_in: [cloud, engine]
  concerns: [X1]
  stages: [platform]
  summary: >-
    Serves the merged configuration for a dataset (platform, then source, then dataset, the metadata DB design
    adopted in D10). Pipelines read configuration only through this port.
  kernel_owns: The key registry, the merge order, defaults that switch every concern on, and waivers.
  supplied_outside: The database that stores the tables.
  operations:
    - {name: dataset_view, intent: Return the merged configuration for one dataset, with its fingerprint.}
    - {name: load, intent: Validate manifest files against the key registry and write them to the store.}
    - {name: watermark, intent: Read or advance a dataset's watermark in the same transaction as its run record.}
  invariants:
    - must: Every concern is on unless a waiver with a reason, an approver and an expiry turns it off.
      because: Optional quality rules are skipped on exactly the table that needed them.
      obligation: CFG-02
      checkable: static
    - must: Only the loader writes configuration, and only from manifest files in version control.
      because: A setting changed by hand in the database cannot be reviewed or replayed.
      obligation: REL-01
      checkable: static

- port: orchestrator
  status: draft
  since: 0.1.0
  service: platform
  tier: core
  binds_in: [engine, cloud]
  concerns: [X2]
  stages: [platform]
  summary: Starts jobs when their inputs are complete, in dependency order, with retries only for passing failures.
  kernel_owns: The dependency graph (from the manifest), which failures are retryable, and the one-writer-per-table rule.
  supplied_outside: Scheduling, triggering and running the jobs.
  operations:
    - {name: trigger, intent: Start a job for a window when its input deliveries are complete.}
    - {name: status, intent: Report the state of a run.}
  invariants:
    - must: A job never starts on partial input.
      because: A report built on half a day looks complete and is wrong.
      obligation: ORCH-01
      checkable: dynamic
    - must: Two runs never write one table at the same time.
      because: Interleaved writes corrupt totals in ways no single run explains.
      obligation: ORCH-04
      checkable: dynamic

- port: quality_runner
  status: draft
  since: 0.1.0
  service: platform
  tier: core
  binds_in: [engine]
  concerns: [X4]
  stages: [silver, gold]
  summary: Runs the quality rules declared in a dataset's contract and returns results with rows examined.
  kernel_owns: Which rules run (from the contract), severity, and the rule that zero rows examined is an error.
  supplied_outside: The rule engine.
  operations:
    - {name: run, intent: Run a dataset's rules on a batch and return pass, fail or error per rule, with rows examined and rows failed.}
  invariants:
    - must: A rule that examined zero rows reports error.
      because: Zero failures out of zero rows is not a pass.
      obligation: GATE-01
      checkable: dynamic

- port: profiler
  status: draft
  since: 0.1.0
  service: platform
  tier: later
  binds_in: [engine]
  concerns: [X5]
  stages: [bronze, silver]
  summary: Measures what each batch looks like (counts, nulls, distinct values, ranges) and compares it with recent batches.
  kernel_owns: Which measures are kept and the drift thresholds.
  supplied_outside: The profiling engine.
  operations:
    - {name: profile, intent: Profile a batch and store the result.}
    - {name: drift, intent: Compare a profile with recent ones and report changes beyond thresholds.}
  invariants:
    - must: Every batch is profiled and drift beyond a threshold is reported.
      because: A source that starts sending zeros for unknowns changes averages without breaking any rule.
      obligation: PROF-01
      checkable: dynamic

- port: reconciler
  status: draft
  since: 0.1.0
  service: platform
  tier: core
  binds_in: [engine]
  concerns: [X6]
  stages: [sources, bronze, silver, gold]
  summary: Compares counts and control totals between two hops and judges the difference against a tolerance.
  kernel_owns: The hops compared, the measures, the tolerances and who signs differences off.
  supplied_outside: Reading counts and totals from each store.
  operations:
    - {name: compare, intent: Compare two hops for a window by a rule and return the difference and a verdict.}
  invariants:
    - must: A drift names the first hop where it appeared.
      because: Knowing only that source and report disagree costs days of searching.
      obligation: REC-05
      checkable: dynamic
    - must: Every comparison has a declared tolerance.
      because: Without one, every difference is either ignored or an emergency.
      obligation: REC-03
      checkable: static

- port: lineage_emitter
  status: draft
  since: 0.1.0
  service: platform
  tier: core
  binds_in: [engine]
  concerns: [X7]
  stages: [bronze, silver, gold, semantic]
  summary: Emits a lineage event for every run, naming what it read and what it wrote.
  kernel_owns: The allowed edges between layers and the check against them.
  supplied_outside: The lineage store and its viewer.
  operations:
    - {name: emit, intent: Send one run's inputs and outputs as a lineage event.}
    - {name: edges, intent: Return recorded edges for a table, upstream or downstream.}
  invariants:
    - must: Every run emits lineage.
      because: A gap in lineage is exactly where a broken dependency hides.
      obligation: LIN-01
      checkable: dynamic

- port: telemetry
  status: draft
  since: 0.1.0
  service: platform
  tier: core
  binds_in: [engine, cloud]
  concerns: [X8, X9]
  stages: [platform]
  summary: Carries logs, metrics and alerts, so one run can be followed end to end and failures reach a person.
  kernel_owns: The run id carried on every log line, the freshness measures, and who is paged for what.
  supplied_outside: Collecting, storing and alerting.
  operations:
    - {name: record, intent: Record a log line or measure tagged with the run id.}
    - {name: alert, intent: Send an alert to the owner of a dataset or job.}
  invariants:
    - must: A failed run reaches a named person within the declared time.
      because: An alert nobody receives is the same as no alert.
      obligation: OPS-01
      checkable: dynamic
    - must: Freshness is measured end to end on every run.
      because: Each job being on time does not mean the report is.
      obligation: PERF-02
      checkable: dynamic

- port: run_log
  status: draft
  since: 0.1.0
  service: platform
  tier: core
  binds_in: [cloud, engine]
  concerns: [X14]
  stages: [platform]
  summary: Keeps a record of every run, its inputs and outputs, counts, status and the configuration it ran under.
  kernel_owns: The record shape, one for every mover and engine.
  supplied_outside: The store.
  operations:
    - {name: start, intent: Open a run record with the configuration fingerprint and snapshot.}
    - {name: finish, intent: Close a run record with counts, status and outputs.}
  invariants:
    - must: Every run record carries the configuration fingerprint it ran under.
      because: A replay must know exactly what it is repeating.
      obligation: CFG-03
      checkable: dynamic
    - must: Every row can be traced to the run and delivery that wrote it.
      because: Without it, "where did this row come from" takes a day to answer.
      obligation: OPS-03
      checkable: dynamic

- port: evidence
  status: draft
  since: 0.1.0
  service: platform
  tier: core
  binds_in: [engine]
  concerns: [X14, X6, X4, X7]
  stages: [platform]
  summary: Joins everything known about one run (run log, quality results, reconciliation, lineage, cost) by its run id, to answer "is this number right, and how do we know?"
  kernel_owns: The run id every port writes, and the join.
  supplied_outside: Where the joined view is stored and shown.
  operations:
    - {name: for_run, intent: Return every verdict and record for one run id.}
    - {name: for_number, intent: Return the runs and verdicts behind one published number.}
  invariants:
    - must: Every verdict and record a port writes carries the run id it belongs to.
      because: Products each report alone; without a shared id the evidence for one number is scattered across tools.
      obligation: OPS-03
      checkable: dynamic
    - must: A planted incident's detector verdict is in the evidence for the run that met it.
      because: The simulation proves a detector fired only if the proof sits beside the run.
      obligation: SIM-01
      checkable: dynamic

- port: cost_ledger
  status: draft
  since: 0.1.0
  service: platform
  tier: later
  binds_in: [engine, cloud]
  concerns: [X10]
  stages: [platform]
  summary: Attributes spend to a team, a dataset and a job, and holds budgets against it.
  kernel_owns: The tags every job carries and the budgets.
  supplied_outside: Billing data and enforcement of compute limits.
  operations:
    - {name: attribute, intent: Return spend by team, dataset and job for a period.}
    - {name: untagged, intent: Return spend that carries no tag.}
  invariants:
    - must: Untagged spend is reported.
      because: The cost nobody owns is the cost nobody cuts.
      obligation: COST-03
      checkable: dynamic

- port: access_control
  status: draft
  since: 0.1.0
  service: platform
  tier: later
  binds_in: [engine]
  concerns: [X11, X12]
  stages: [silver, gold, semantic, experiences]
  summary: Grants access by role and masks or filters restricted columns and rows.
  kernel_owns: Roles, classifications and the masking rule per classification.
  supplied_outside: Enforcing grants and masks in the store.
  operations:
    - {name: grant, intent: Apply the declared grants for a dataset.}
    - {name: check, intent: Report what a role can read in a dataset.}
  invariants:
    - must: The lowest-privilege role cannot read a restricted column directly.
      because: A mask applied only in the dashboard leaks through every other door.
      obligation: SEC-02
      checkable: dynamic

- port: secret_store
  status: draft
  since: 0.1.0
  service: platform
  tier: core
  binds_in: [engine, cloud]
  concerns: [X11]
  stages: [platform]
  summary: Hands credentials to jobs at run time, so none are written in code or configuration.
  kernel_owns: The names jobs ask for.
  supplied_outside: Storing and rotating secrets.
  operations:
    - {name: get, intent: Return a credential by name to an authorised job identity.}
  invariants:
    - must: No credential appears in the repository.
      because: A secret in history is a secret published.
      obligation: REL-05
      checkable: static

- port: deployer
  status: draft
  since: 0.1.0
  service: platform
  tier: later
  binds_in: [engine, cloud]
  concerns: [X16]
  stages: [platform]
  summary: Promotes one build through environments and rolls back a release, including its data changes.
  kernel_owns: The environment list and what may differ between them (configuration only).
  supplied_outside: Building, deploying and infrastructure.
  operations:
    - {name: promote, intent: Deploy a build to the next environment.}
    - {name: rollback, intent: Return an environment to the previous release, including tables it changed.}
  invariants:
    - must: The same build is promoted, with no manual change in the target.
      because: A hand fix in production is lost on the next deploy.
      obligation: REL-03
      checkable: dynamic

- port: clock
  status: draft
  since: 0.1.0
  service: platform
  tier: core
  binds_in: [engine]
  concerns: [X22, X15]
  stages: [platform]
  summary: The only source of "now" for jobs, so the simulated world can move time and a replay can run as of a past day.
  kernel_owns: The rule that no job reads the system time directly, and the declared business time zone.
  supplied_outside: Real time in production; a controlled clock in simulation and tests.
  operations:
    - {name: now, intent: Return the current time in the declared time zone.}
  invariants:
    - must: Jobs read time only from this port.
      because: A job that reads the machine's clock cannot be replayed or simulated.
      obligation: SIM-01
      checkable: static

# ---------- Added for Goal 1b (session B, from the deck crosswalk). Service A ----------
- port: source_reader
  status: draft
  since: 0.2.0
  service: A
  tier: core
  binds_in: [engine]
  concerns: [X15, X3]
  stages: [sources, bronze]
  summary: >-
    Pull: reads a source directly (database, interface, file server) and hands the batch to the lander steps
    in-process, straight to bronze with no landing copy (ADR-002, decision D11 as amended).
  kernel_owns: >-
    The lander steps every batch passes whichever way it came (contract check, personal-data tokenising, mass-delete
    guard, file and batch log), the watermark, and the rule that a table that can delete rows is read as a full copy.
  supplied_outside: Connecting to the source, paging, segmenting large reads and the read itself.
  operations:
    - {name: read, intent: Read one declared window (or a full copy) of one dataset and return it with its row count.}
    - {name: describe, intent: Report which read modes the connector supports (full, watermark, pages, files)., optional: true}
  invariants:
    - must: A pulled batch passes the same lander steps as a pushed file before it reaches bronze.
      because: A second way in that skips the checks is where personal data and broken shapes slip through.
      obligation: SCH-02
      checkable: static
    - must: Watermarks live in the metadata service, never inside the connector.
      because: State kept inside a connector is lost when the source moves to another connector.
      obligation: HIST-04
      checkable: static
    - must: A table whose rows can be deleted is read as a full copy, not by watermark.
      because: A watermark read never sees a delete.
      obligation: DEL-01
      checkable: static

- port: stage_runner
  status: draft
  since: 0.2.0
  service: A
  tier: core
  binds_in: [engine]
  concerns: [X4, X1]
  stages: [silver]
  summary: >-
    Runs the thirteen standard bronze-to-silver stages (ADR-007) for any dataset, switched on and tuned per column
    from metadata; the same code for every table.
  kernel_owns: >-
    The stages, their order, the per-column settings each reads, and the rule that no free-form query runs between
    bronze and silver.
  supplied_outside: The dataframe or declarative pipeline engine that executes the stages.
  operations:
    - {name: run, intent: Run the standard stages for one dataset's batch and return silver rows, quarantined rows and counts per stage.}
  invariants:
    - must: A value that cannot be converted goes to quarantine or is emptied and counted, as its column says; never silently emptied.
      because: A date that quietly becomes empty changes totals with no trace.
      obligation: DQ-02
      checkable: dynamic
    - must: A new table is new metadata rows, never new stage code.
      because: Copy-pasted pipelines per table drift apart within months.
      obligation: CFG-01
      checkable: static

- port: stream_bus
  status: draft
  since: 0.2.0
  service: A
  tier: later
  binds_in: [cloud, engine]
  concerns: [X15, X18, X9]
  stages: [sources, bronze]
  summary: >-
    Carries a continuous flow of events from machines and sensors into the platform; for streams it is the landing
    (decision D5: one medallion, two speeds).
  kernel_owns: The event id, the event-time column, the late allowance, and the checkpoint position kept per reader.
  supplied_outside: Receiving, retaining and serving the events.
  operations:
    - {name: read, intent: Read events from a checkpoint onwards.}
    - {name: retention, intent: Report how long events are kept, so a reader knows how long it may be down., optional: true}
  invariants:
    - must: Events are kept longer than the longest outage the platform promises to recover from.
      because: A reader that restarts after the events expired loses them for good.
      obligation: ORCH-06
      checkable: static
    - must: A replayed event is dropped by its event id.
      because: Replays after a restart would count the same reading twice.
      obligation: DUP-04
      checkable: dynamic

- port: tokenizer
  status: draft
  since: 0.2.0
  service: A
  tier: core
  binds_in: [cloud, engine]
  concerns: [X12]
  stages: [landing, bronze]
  summary: >-
    Replaces personal values with random tokens before bronze; the real values live only in a token vault. Finds
    personal data in free text through a detector behind the same port.
  kernel_owns: The personal-data class per column (from the contract), the suppression list, and the erasure flow.
  supplied_outside: The vault store and the free-text detector.
  operations:
    - {name: tokenise, intent: Replace the personal columns of a batch with tokens and store the real values in the vault.}
    - {name: erase, intent: Delete a person's vault entries and add them to the suppression list.}
    - {name: detect, intent: Find personal data in free text and return the spans to tokenise., optional: true}
  invariants:
    - must: No personal value reaches bronze untokenised.
      because: Once a real value is in an append-only layer, erasing it means rewriting history.
      obligation: SEC-01
      checkable: dynamic
    - must: Deleting a person's vault entry makes every copy of their data anonymous.
      because: Erasure that depends on finding every copy never finishes.
      obligation: SEC-03
      checkable: dynamic

# ---------- Service C: serve (split from experience, because the deck's Out Port needs it) ----------
- port: conversation
  status: draft
  since: 0.2.0
  service: C
  tier: later
  binds_in: [engine, cloud]
  concerns: [X13, X11]
  stages: [experiences]
  summary: Answers business questions asked in plain words, from certified metrics only.
  kernel_owns: The certified-metric list, synonyms and sample questions (from the metric files), and the asker's identity.
  supplied_outside: Understanding the question and writing the query.
  operations:
    - {name: ask, intent: Answer one question for one asker and return the answer with the metric and query used.}
  invariants:
    - must: Answers come only from certified metrics.
      because: A confident answer from an uncertified formula is the most dangerous wrong number.
      obligation: SERV-04
      checkable: static
    - must: The asker's own access applies to every answer.
      because: A conversation interface that reads as a service account leaks every restricted row.
      obligation: SEC-02
      checkable: dynamic

- port: data_api
  status: draft
  since: 0.2.0
  service: C
  tier: later
  binds_in: [engine, cloud]
  concerns: [X3, X11]
  stages: [experiences]
  summary: Serves published data products to other systems over a request-response interface.
  kernel_owns: Which products are exposed, their contracts and the caller's identity.
  supplied_outside: The endpoint, authentication and query execution.
  operations:
    - {name: query, intent: Return rows of a published product for an authorised caller.}
  invariants:
    - must: Only published products with a contract are served.
      because: An endpoint on an internal table becomes a contract nobody agreed to.
      obligation: SERV-01
      checkable: static
    - must: The caller's identity and grants apply.
      because: One shared key for every caller makes access unauditable.
      obligation: SEC-02
      checkable: dynamic

- port: event_publisher
  status: draft
  since: 0.2.0
  service: C
  tier: later
  binds_in: [cloud]
  concerns: [X3, X15]
  stages: [experiences]
  summary: Publishes business events (an order shipped late, a press stopped) for other systems to react to.
  kernel_owns: The event contracts, the event id and the rule for when an event is published.
  supplied_outside: Delivering events to subscribers.
  operations:
    - {name: publish, intent: Publish one event under its contract with a stable id.}
  invariants:
    - must: Every event carries a contract version and a stable id, so a rerun publishes nothing new.
      because: Subscribers act on events; a duplicate event is a duplicate action.
      obligation: DUP-02
      checkable: dynamic
    - must: Nothing is published without a contract.
      because: Subscribers have nothing to hold the platform to otherwise.
      obligation: SERV-01
      checkable: static

- port: feed_writer
  status: draft
  since: 0.2.0
  service: C
  tier: later
  binds_in: [engine]
  concerns: [X15, X7]
  stages: [experiences]
  summary: Writes scheduled extracts of published products to another system (a reverse load or a partner feed).
  kernel_owns: The feed definition (product, columns, schedule, target) from configuration.
  supplied_outside: The transfer to the target.
  operations:
    - {name: send, intent: Write one window of a product to the feed's target.}
  invariants:
    - must: Sending the same window twice changes nothing at the target.
      because: Targets outside the platform cannot be rolled back by it.
      obligation: DUP-02
      checkable: dynamic
    - must: Feeds read only published products.
      because: A feed from silver bypasses the checks gold makes before publish.
      obligation: FLOW-01
      checkable: static

- port: vector_index
  status: draft
  since: 0.2.0
  service: C
  tier: later
  binds_in: [engine, cloud]
  concerns: [X12, X11]
  stages: [experiences]
  summary: Holds document chunks and their embeddings for retrieval by AI assistants (archetype PA7).
  kernel_owns: The chunking rule, the source document id on every chunk and the access tags carried from the source.
  supplied_outside: Embedding, indexing and similarity search.
  operations:
    - {name: upsert, intent: Add or replace the chunks of one document.}
    - {name: delete, intent: Remove every chunk of one document.}
    - {name: search, intent: Return the chunks an asker may read that best match a question.}
  invariants:
    - must: A document deleted at the source is gone from the index within the declared time.
      because: Assistants keep quoting documents that were withdrawn.
      obligation: DEL-03
      checkable: dynamic
    - must: Search returns only chunks the asker may read.
      because: Retrieval is a side door around every grant.
      obligation: SEC-02
      checkable: dynamic

- port: feature_store
  status: draft
  since: 0.2.0
  service: C
  tier: later
  binds_in: [engine]
  concerns: [X4, X7]
  stages: [gold, experiences]
  summary: Holds features for machine-learning models, computed from gold, read the same way in training and serving (PA6).
  kernel_owns: Feature names, their source gold tables, the entity key and the time column for point-in-time reads.
  supplied_outside: Storing features and serving them at low latency.
  operations:
    - {name: write, intent: Write a feature table from its declared gold source.}
    - {name: read_as_of, intent: Return features for entities as they were at given times.}
  invariants:
    - must: Training reads features as of each label's time, never later.
      because: Features from the future make a model look accurate in training and fail in use.
      obligation: SCD-04
      checkable: dynamic
    - must: Every feature table emits lineage to its gold source.
      because: A model that drifts cannot be traced to the table that changed.
      obligation: LIN-01
      checkable: dynamic

- port: model_registry
  status: draft
  since: 0.2.0
  service: C
  tier: later
  binds_in: [engine]
  concerns: [X14, X16]
  stages: [experiences]
  summary: Records every trained model version with its data, code, metrics and card, and its stage (candidate, approved, retired).
  kernel_owns: The model card (from the manifest, ADR-021) and the promotion rule.
  supplied_outside: Tracking runs and storing model artefacts.
  operations:
    - {name: register, intent: Record a trained version with its training data version, code version and metrics.}
    - {name: promote, intent: Move a version to the next stage when its gates pass.}
  invariants:
    - must: Every model version records the data window, code and configuration it was trained with.
      because: A model nobody can retrain the same way cannot be audited.
      obligation: CFG-03
      checkable: dynamic
    - must: A version is promoted only through the same gates as code.
      because: A model swapped by hand in production skips every test.
      obligation: REL-03
      checkable: static

- port: model_server
  status: draft
  since: 0.2.0
  service: C
  tier: later
  binds_in: [engine, cloud]
  concerns: [X9, X11]
  stages: [experiences]
  summary: Serves an approved model's predictions in batch or online, and watches its inputs and outputs for drift.
  kernel_owns: The drift and freshness thresholds from the model card, and who may call it.
  supplied_outside: The serving endpoint or batch scoring job.
  operations:
    - {name: predict, intent: Return predictions for a batch or a request.}
    - {name: monitor, intent: Compare recent inputs and outputs with the training profile and report drift.}
  invariants:
    - must: Drift and feature freshness are measured against the model card's thresholds.
      because: A model fed stale features keeps answering confidently.
      obligation: PERF-02
      checkable: dynamic
    - must: Only authorised callers get predictions.
      because: Predictions can reveal the restricted data they were trained on.
      obligation: SEC-02
      checkable: dynamic

# ---------- Platform: governance, foundation and agents ----------
- port: data_catalog
  status: draft
  since: 0.2.0
  service: platform
  tier: later
  binds_in: [engine]
  concerns: [X13, X12]
  stages: [platform]
  summary: Lists every table and product with its owner, description, classification tags and glossary terms, and makes them searchable.
  kernel_owns: The tag standard and the rule that entries are filled from contracts, never typed by hand.
  supplied_outside: Storing, searching and showing the entries.
  operations:
    - {name: register, intent: Write a table's owner, description, tags and terms from its contract.}
    - {name: search, intent: Find tables and products by name, term or tag.}
  invariants:
    - must: Every published table has an owner and a description from its contract.
      because: A table nobody owns is a table nobody fixes.
      obligation: SERV-01
      checkable: static
    - must: Every personal-data column carries its classification tag.
      because: Masks and retention rules are driven by the tag; an untagged column is unprotected.
      obligation: SEC-01
      checkable: static

- port: audit_log
  status: draft
  since: 0.2.0
  service: platform
  tier: later
  binds_in: [engine, cloud]
  concerns: [X14]
  stages: [platform]
  summary: Records who read, granted, changed or deleted what, and when, across the platform and the cloud account.
  kernel_owns: Which events are kept, for how long, and who reviews them.
  supplied_outside: Capturing and storing the events.
  operations:
    - {name: query, intent: Return audit events for a table, a person or a period.}
  invariants:
    - must: Every read of restricted data and every grant change is recorded.
      because: Without it, a leak cannot be scoped.
      obligation: SEC-04
      checkable: dynamic

- port: key_manager
  status: draft
  since: 0.2.0
  service: platform
  tier: later
  binds_in: [cloud]
  concerns: [X11]
  stages: [platform]
  summary: Holds the encryption keys for storage, the metadata store and the token vault, and rotates them.
  kernel_owns: Which store uses which key, and who may use each key.
  supplied_outside: Key storage, rotation and encryption.
  operations:
    - {name: key_for, intent: Return the key reference a store must use.}
  invariants:
    - must: Each store is encrypted with a key whose use is limited to that store's service identities.
      because: One key for everything means one leaked role decrypts everything.
      obligation: SEC-02
      checkable: static

- port: identity_provider
  status: draft
  since: 0.2.0
  service: platform
  tier: core
  binds_in: [cloud, engine]
  concerns: [X11]
  stages: [platform]
  summary: Holds people, groups and service identities; every grant is to a group or a service identity.
  kernel_owns: The group list per environment and the rule that jobs run as service identities.
  supplied_outside: Identities, sign-in and federation.
  operations:
    - {name: groups, intent: Return the groups a person or service belongs to.}
  invariants:
    - must: Grants go to groups and service identities, never to named people.
      because: Access granted to people outlives their role.
      obligation: ENV-02
      checkable: static

- port: network_boundary
  status: draft
  since: 0.2.0
  service: platform
  tier: later
  binds_in: [cloud]
  concerns: [X11, X16]
  stages: [platform]
  summary: Keeps data paths between sources, storage and compute private, and separates environments.
  kernel_owns: The allowed paths, declared per environment.
  supplied_outside: Networks, private endpoints and firewalls.
  operations:
    - {name: paths, intent: Return the declared network paths for an environment.}
  invariants:
    - must: Development cannot reach production data over the network.
      because: Separation that exists only in naming is not separation.
      obligation: ENV-01
      checkable: dynamic

- port: object_store
  status: draft
  since: 0.2.0
  service: platform
  tier: core
  binds_in: [cloud]
  concerns: [X18, X19]
  stages: [landing, bronze, silver, gold]
  summary: Stores the bytes under landing and every table, per environment and layer.
  kernel_owns: The location per environment and layer (ADR-012), versioning and replication to meet the recovery targets.
  supplied_outside: Durable storage.
  operations:
    - {name: location, intent: Return the storage location for an environment and a layer.}
  invariants:
    - must: Storage is versioned and copied as far as the declared recovery targets require.
      because: Recovery targets that the storage cannot meet are only words.
      obligation: ORCH-05
      checkable: static

- port: compute_pool
  status: draft
  since: 0.2.0
  service: platform
  tier: core
  binds_in: [engine, cloud]
  concerns: [X10, X19]
  stages: [platform]
  summary: Supplies compute for jobs, pipelines and queries, sized by rule and stopped when idle.
  kernel_owns: The sizing rules, the idle limit and the cost tags every pool carries.
  supplied_outside: The compute itself.
  operations:
    - {name: acquire, intent: Return compute for a job, sized by its rule and tagged.}
  invariants:
    - must: Nothing runs when nothing needs it.
      because: Idle compute is the most common waste on any platform.
      obligation: COST-04
      checkable: dynamic
    - must: Every pool carries the team, dataset and job tags.
      because: Cost without an owner is cost nobody cuts.
      obligation: COST-03
      checkable: static

- port: infra_provisioner
  status: draft
  since: 0.2.0
  service: platform
  tier: core
  binds_in: [cloud, engine]
  concerns: [X16]
  stages: [platform]
  summary: Creates accounts, environments, networks, storage, catalogs and workspaces from code.
  kernel_owns: The environment list and the modules each environment is built from.
  supplied_outside: Applying the code to the cloud and the engine.
  operations:
    - {name: plan, intent: Show what applying the code would change.}
    - {name: apply, intent: Make an environment match the code.}
  invariants:
    - must: Every environment is built from code; nothing is created by hand.
      because: A hand-built environment cannot be rebuilt after a disaster.
      obligation: REL-06
      checkable: static

- port: agent_runtime
  status: draft
  since: 0.2.0
  service: platform
  tier: later
  binds_in: [cloud, engine]
  concerns: [X21, X20]
  stages: [platform]
  summary: >-
    Runs the platform's agents (alert triage, ask-your-data, self-healing). The harness kernel is cloud-free; model,
    gateway and runtime are adapters (decision M6). Data tools are reached through a tool protocol.
  kernel_owns: Which agents are enabled (from the manifest), their tools, their autonomy level and the gates their proposals pass.
  supplied_outside: The model, the gateway and the hosted runtime.
  operations:
    - {name: run, intent: Run one agent task and return its proposal and evidence.}
  invariants:
    - must: Agents propose changes as manifest pull requests; the same gates decide.
      because: An agent that changes production directly bypasses every test.
      obligation: GATE-03
      checkable: static
    - must: A self-healing fix is verified and can be rolled back like any release.
      because: A fix that cannot be undone turns one incident into two.
      obligation: HEAL-01
      checkable: dynamic
